<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TE</title>

<style>
  html,
  body {
    margin: 0;
    padding: 0;
  }

  * {
    box-sizing: border-box;
  }

  textarea {
    resize: none;
  }

  .grid {
    display: grid;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  .grid--top {
    grid-template-columns: 100%;
    grid-template-rows: 32px 1fr 1fr 1fr;
  }

  .grid--right {
    grid-template-columns: 1fr 32px;
    grid-template-rows: 1fr 1fr 1fr;
  }

  .grid--bottom {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 1fr 1fr 32px;
  }

  .grid--left {
    grid-template-columns: 32px 1fr;
    grid-template-rows: 1fr 1fr 1fr;
  }

  .nav {
    grid-area: nav;
    z-index: 10;
  }

  .editor {
    z-index: 5;
    overflow: hidden;
  }

  .html {
    grid-area: html;
  }

  .css {
    grid-area: css;
  }

  .js {
    grid-area: js;
  }

  .viewer {
    grid-area: viewer;
    z-index: 4;
    border: 0;
    overflow: auto;
  }

  .grid--top {
    grid-template-areas:
      "nav"
      "html"
      "css"
      "js";
  }

  .grid--right {
    grid-template-areas:
      "html nav"
      "css viewer"
      "js viewer";
  }

  .grid--bottom {
    grid-template-areas:
      "html"
      "css"
      "js"
      "nav";
  }

  .grid--left {
    grid-template-areas:
      "nav html"
      "viewer css"
      "viewer js";
  }

  /* =========================================================
     VIEWER-ONLY / ?H MODE
     ========================================================= */

  .grid.viewer-only {
    display: block;
    width: 100vw;
    height: auto;
    min-height: 0;
    overflow: visible;
  }

  .grid.viewer-only .nav,
  .grid.viewer-only .editor {
    display: none;
  }

  .grid.viewer-only .viewer {
    display: block;
    width: 100vw;
    height: 100vh;
    min-height: 0;
    border: 0;
    overflow: hidden;
  }

  html.viewer-only-page,
  body.viewer-only-page {
    height: auto !important;
    min-height: 100%;
  }

  body.viewer-only-page {
    overflow-x: hidden;
  }

  /* =========================================================
     BASIC CLASSES USED BY TE
     ========================================================= */

  .w-100 {
    width: 100%;
  }

  .h-100 {
    height: 100%;
  }

  .ma0 {
    margin: 0;
  }

  .pa0 {
    padding: 0;
  }

  .bn {
    border: 0;
  }

  .bg-gold {
    background-color: #ffdf00;
  }

  .overflow-auto {
    overflow: auto;
  }

  .pre {
    white-space: pre;
  }

  /* =========================================================
     MOBILE
     ========================================================= */

  @media screen and (max-width: 600px) {
    .grid {
      display: block;
      width: 100vw;
      height: auto;
      min-height: 100vh;
      overflow: visible;
    }

    .nav {
      position: sticky;
      top: 0;
      width: 100%;
      height: 32px;
    }

    .editor {
      width: 100%;
      height: 33vh;
      min-height: 240px;
    }

    .viewer {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: calc(100vh + 32px);
      z-index: 4;
      top: 0;
    }

    .grid.viewer-only {
      display: block;
      width: 100vw;
      height: auto;
      min-height: 0;
      overflow: visible;
    }

    .grid.viewer-only .viewer {
      display: block;
      width: 100vw;
      height: 100vh;
      min-height: 0;
      overflow: hidden;
      position: relative;
      top: 0;
      z-index: 1;
    }
  }
</style>
</head>

<body class="w-100 h-100 ma0">

<div id="grid" class="grid grid--left">

  <div class="nav">
    <!-- Your existing navigation can remain here -->
  </div>

  <textarea
    id="editorHTML"
    class="editor html"
    spellcheck="false"
    placeholder="HTML"
  ></textarea>

  <textarea
    id="editorCSS"
    class="editor css"
    spellcheck="false"
    placeholder="CSS"
  ></textarea>

  <textarea
    id="editorJS"
    class="editor js"
    spellcheck="false"
    placeholder="JS"
  ></textarea>

  <iframe
    id="viewer"
    class="viewer bg-gold overflow-auto pre w-100 h-100 bn"
  ></iframe>

</div>

<script>

/* =========================================================
   DATE STAMP
   ========================================================= */

Object.defineProperty(Date.prototype, 'YYYYMMDDHHMMSS', {
  value: function() {
    function pad2(n) {
      return (n < 10 ? '0' : '') + n;
    }

    return this.getFullYear() +
      pad2(this.getMonth() + 1) +
      pad2(this.getDate()) +
      pad2(this.getHours()) +
      pad2(this.getMinutes()) +
      pad2(this.getSeconds());
  }
});

function stampDate() {
  return new Date().YYYYMMDDHHMMSS();
}


/* =========================================================
   ELEMENTS
   ========================================================= */

var grid = document.getElementById("grid");
var viewer = document.getElementById("viewer");

var editorHTML = document.getElementById("editorHTML");
var editorCSS = document.getElementById("editorCSS");
var editorJS = document.getElementById("editorJS");


/* =========================================================
   URL / HASH
   ========================================================= */

var rawHash = window.location.hash
  ? window.location.hash.substring(1)
  : "";

var hashParts = rawHash.split("?");

var hash = hashParts[0] || "P";

var projectName = hash !== "P"
  ? decodeURIComponent(hash)
  : "";

var urlMarker = (hashParts[1] || "").toUpperCase();

var urlHide = urlMarker === "H";

var urlLayout = /^(T|R|B|L)$/.test(urlMarker)
  ? urlMarker.toLowerCase()
  : "left";

var hashPayload =
  urlHide || /^(T|R|B|L)$/.test(urlMarker)
    ? hashParts.slice(2).join("?")
    : hashParts.slice(1).join("?");


/* =========================================================
   LAYOUT
   ========================================================= */

function getLayout() {
  grid.classList.remove(
    "grid--top",
    "grid--right",
    "grid--bottom",
    "grid--left"
  );

  grid.classList.add("grid--" + urlLayout);
}


/* =========================================================
   VIEWER-ONLY MODE
   ========================================================= */

function setViewerOnly(hidden) {

  grid.classList.toggle("viewer-only", hidden);

  document.documentElement.classList.toggle(
    "viewer-only-page",
    hidden
  );

  document.body.classList.toggle(
    "viewer-only-page",
    hidden
  );

  if (!hidden) {
    clearViewerBackground();
    viewer.style.removeProperty("height");
  }
}


/* =========================================================
   VIEWER CONTENT
   ========================================================= */

function buildViewerSrcdoc(HTMLView, CSSView, JSView) {

  var viewerStateScript = [
    "<script>",
    "(function(){",

    "var frameStateQueued = false;",

    "function getBackgroundState(style) {",
    "return {",
    "color: style.backgroundColor,",
    "image: style.backgroundImage,",
    "repeat: style.backgroundRepeat,",
    "position: style.backgroundPosition,",
    "size: style.backgroundSize,",
    "attachment: style.backgroundAttachment",
    "};",
    "}",

    "function sendViewerState() {",

    "var body = document.body;",
    "var html = document.documentElement;",

    "var htmlStyle = getComputedStyle(html);",
    "var bodyStyle = body ? getComputedStyle(body) : htmlStyle;",

    "var height = Math.max(",
    "body ? body.scrollHeight : 0,",
    "body ? body.offsetHeight : 0,",
    "html ? html.scrollHeight : 0,",
    "html ? html.offsetHeight : 0,",
    "window.innerHeight || 0",
    ");",

    "parent.postMessage({",
    "type: 'TE_VIEWER_STATE',",
    "height: height,",
    "htmlBackground: getBackgroundState(htmlStyle),",
    "bodyBackground: getBackgroundState(bodyStyle)",
    "}, '*');",

    "}",

    "function queueViewerState() {",

    "if (frameStateQueued) return;",

    "frameStateQueued = true;",

    "requestAnimationFrame(function(){",
    "frameStateQueued = false;",
    "sendViewerState();",
    "});",

    "}",

    "window.addEventListener('load', sendViewerState);",
    "window.addEventListener('resize', queueViewerState);",

    "if (window.ResizeObserver) {",

    "var resizeObserver = new ResizeObserver(function(){",
    "queueViewerState();",
    "});",

    "if (document.documentElement) {",
    "resizeObserver.observe(document.documentElement);",
    "}",

    "if (document.body) {",
    "resizeObserver.observe(document.body);",
    "}",

    "}",

    "if (window.MutationObserver) {",

    "var mutationObserver = new MutationObserver(function(){",
    "queueViewerState();",
    "});",

    "mutationObserver.observe(document.documentElement, {",
    "attributes: true,",
    "childList: true,",
    "subtree: true"
    + "});",

    "}",

    "if (document.fonts && document.fonts.ready) {",
    "document.fonts.ready.then(sendViewerState);",
    "}",

    "setTimeout(sendViewerState, 0);",
    "setTimeout(sendViewerState, 100);",
    "setTimeout(sendViewerState, 500);",
    "setTimeout(sendViewerState, 1000);",

    "})();",
    "<\/script>"
  ].join("\n");

  return HTMLView + CSSView + JSView + viewerStateScript;
}


/* =========================================================
   BACKGROUND INHERITANCE
   ========================================================= */

var backgroundProperties = [
  "background-color",
  "background-image",
  "background-repeat",
  "background-position",
  "background-size",
  "background-attachment"
];


function applyBackground(target, background) {

  if (!target || !background) {
    return;
  }

  target.style.setProperty(
    "background-color",
    background.color
  );

  target.style.setProperty(
    "background-image",
    background.image
  );

  target.style.setProperty(
    "background-repeat",
    background.repeat
  );

  target.style.setProperty(
    "background-position",
    background.position
  );

  target.style.setProperty(
    "background-size",
    background.size
  );

  target.style.setProperty(
    "background-attachment",
    background.attachment
  );
}


function clearBackground(target) {

  if (!target) {
    return;
  }

  backgroundProperties.forEach(function(property) {
    target.style.removeProperty(property);
  });
}


function clearViewerBackground() {

  clearBackground(document.documentElement);
  clearBackground(document.body);
}


function applyViewerBackground(data) {

  if (!urlHide || !data) {
    return;
  }

  /*
   * Copy the iframe's <html> background
   * to the real page's <html>.
   */
  applyBackground(
    document.documentElement,
    data.htmlBackground
  );

  /*
   * Copy the iframe's <body> background
   * to the real page's <body>.
   *
   * This preserves transparent body backgrounds,
   * background images, gradients, etc.
   */
  applyBackground(
    document.body,
    data.bodyBackground
  );
}


/* =========================================================
   VIEWER AUTO HEIGHT + BACKGROUND
   ========================================================= */

function enableViewerOnlyAutoHeight() {

  window.addEventListener("message", function(event) {

    if (event.source !== viewer.contentWindow) {
      return;
    }

    if (!event.data) {
      return;
    }

    if (event.data.type !== "TE_VIEWER_STATE") {
      return;
    }

    if (!urlHide) {
      return;
    }

    /*
     * Keep the iframe at least viewport height,
     * but allow it to grow with its actual content.
     */
    var height = Math.max(
      Number(event.data.height) || 0,
      window.innerHeight || 0
    );

    viewer.style.setProperty(
      "height",
      height + "px",
      "important"
    );

    /*
     * Make the outer page use the same background
     * as the iframe preview.
     */
    applyViewerBackground(event.data);

  });

}


/* =========================================================
   HASH UPDATES
   ========================================================= */

function getCurrentHashPayload() {

  return encodeURIComponent(editorHTML.value) +
    "?" +
    encodeURIComponent(editorCSS.value) +
    "?" +
    encodeURIComponent(editorJS.value);
}


function updateHashFromEditors() {

  /*
   * Keep the existing URL structure.
   */
  var marker = "";

  if (urlHide) {
    marker = "?H";
  } else if (/^(T|R|B|L)$/.test(urlMarker)) {
    marker = "?" + urlMarker;
  }

  var payload =
    editorHTML.value +
    "?" +
    editorCSS.value +
    "?" +
    editorJS.value;

  var newHash =
    (projectName
      ? encodeURIComponent(projectName)
      : "P") +
    marker +
    (marker ? "?" : "?") +
    payload;

  history.replaceState(
    null,
    "",
    "#" + newHash
  );
}


/* =========================================================
   VIEWER UPDATES
   ========================================================= */

function updateViewerHashPayload() {

  var HTMLView = editorHTML.value;

  var CSSView =
    "<style>\n" +
    '@import url("https://git2358.github.io/TE/css/tachyons.min.css");\n' +
    editorCSS.value +
    "\n<\/style>";

  var JSView =
    "<script>\n" +
    editorJS.value +
    "\n<\/script>";

  viewer.srcdoc = buildViewerSrcdoc(
    HTMLView,
    CSSView,
    JSView
  );

  updateHashFromEditors();
}


function updateViewerHash() {

  var HTMLView = editorHTML.value;

  var CSSView =
    "<style>\n" +
    '@import url("https://git2358.github.io/TE/css/tachyons.min.css");\n' +
    editorCSS.value +
    "\n<\/style>";

  var JSView =
    "<script>\n" +
    editorJS.value +
    "\n<\/script>";

  viewer.srcdoc = buildViewerSrcdoc(
    HTMLView,
    CSSView,
    JSView
  );

  updateHashFromEditors();
}


function updateViewer() {

  var HTMLView = editorHTML.value;

  var CSSView =
    "<style>\n" +
    '@import url("https://git2358.github.io/TE/css/tachyons.min.css");\n' +
    editorCSS.value +
    "\n<\/style>";

  var JSView =
    "<script>\n" +
    editorJS.value +
    "\n<\/script>";

  viewer.srcdoc = buildViewerSrcdoc(
    HTMLView,
    CSSView,
    JSView
  );

  updateHashFromEditors();
}


/* =========================================================
   EMPTY VIEWER
   ========================================================= */

function viewerIsEmpty() {

  if (
    !editorHTML.value &&
    !editorCSS.value &&
    !editorJS.value
  ) {
    viewer.srcdoc = "";
  }
}


/* =========================================================
   FOCUS
   ========================================================= */

function getFocus() {

  if (editorHTML.value) {
    return;
  }

  editorHTML.focus();
}


/* =========================================================
   SCROLL TO VIEWER
   ========================================================= */

function scrollToSection(element) {

  if (!element) {
    return;
  }

  element.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}


function scrollToViewer() {

  scrollToSection(
    document.getElementById("viewer")
  );

}


/* =========================================================
   LOAD PROJECT FROM HASH
   ========================================================= */

function loadFromHash() {

  if (!hashPayload) {
    return;
  }

  var parts = hashPayload.split("?");

  editorHTML.value = parts[0] || "";
  editorCSS.value = parts[1] || "";
  editorJS.value = parts.slice(2).join("?") || "";
}


/* =========================================================
   EVENTS
   ========================================================= */

editorHTML.addEventListener(
  "input",
  updateViewer
);

editorCSS.addEventListener(
  "input",
  updateViewer
);

editorJS.addEventListener(
  "input",
  updateViewer
);


/* =========================================================
   INITIALISE
   ========================================================= */

getLayout();

loadFromHash();

getFocus();

setViewerOnly(urlHide);

enableViewerOnlyAutoHeight();

updateViewer();

viewerIsEmpty();


/* =========================================================
   VIEWER SCROLL
   ========================================================= */

if (!urlHide) {

  setTimeout(function() {
    scrollToViewer();
  }, 500);

}

</script>

</body>
</html>
