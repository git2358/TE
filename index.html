<!DOCTYPE html>
<html class="w-100 h-100 ma0 bg-near-black">
<head>
<title>TE</title>
<meta name=viewport content="width=device-width, initial-scale=1, shrink-to-fit=no">
<style>
@import url(https://unpkg.com/tachyons/css/tachyons.min.css);

:root {
  --one-third-width: calc(100vw/3);
  --two-thirds-width: calc(var(--one-third-width)*2);
  --half-width: calc((var(--one-third-width)*3)/2);
  --full-width: calc(var(--one-third-width)*3);
  --full-width-bleed: calc(var(--one-third-width)*4);

  --one-third-height: calc(100vh/3);
  --two-thirds-height: calc(var(--one-third-height)*2);
  --half-height: calc((var(--one-third-height)*3)/2);
  --full-height: calc(var(--one-third-height)*3);
  --full-height-bleed: calc(var(--one-third-width)*4);
}

.grid { display: grid; }
.grid--top {
  grid-template-columns: var(--one-third-width) var(--one-third-width) var(--one-third-width);
  grid-template-rows: var(--half-height) var(--full-height);
  grid-template-areas: "html css js" "viewer viewer viewer";
}
.grid--right {
  grid-template-columns: var(--full-width) var(--half-width);
  grid-template-rows: var(--one-third-height) var(--one-third-height) var(--one-third-height);
  grid-template-areas: "viewer html" "viewer css" "viewer js";
}
.grid--bottom {
  display: grid;
  grid-template-columns: var(--one-third-width) var(--one-third-width) var(--one-third-width);
  grid-template-rows: var(--full-height) var(--half-height);
  grid-template-areas: "viewer viewer viewer" "html css js";
}
.grid--left {
  grid-template-columns: var(--half-width) var(--full-width);
  grid-template-rows: var(--one-third-height) var(--one-third-height) var(--one-third-height);
  grid-template-areas: "html viewer" "css viewer" "js viewer";
}

.html { grid-area: html; }
.css { grid-area: css; }
.js { grid-area: js; }
.viewer { grid-area: viewer; }

@media print{
  .print-hide { display: none }
}
</style>
</head>
<body class="w-100 h-100 ma0">

<div class="grid grid--left">
  <textarea class="html editor print-hide bg-red near-white pa4 input-reset b--black-50 ba br0 outline-0 fl code f5" placeholder=HTML wrap=soft autocomplete=on autocorrect=off autocapitalize=off spellcheck=on data-gramm=false></textarea>

  <textarea class="css editor print-hide bg-green near-white pa4 input-reset b--black-50 ba br0 outline-0 fl code f5" placeholder=HTML wrap=soft autocomplete=on autocorrect=off autocapitalize=off spellcheck=on data-gramm=false></textarea>

  <textarea class="js editor print-hide bg-blue near-white pa4 input-reset b--black-50 ba br0 outline-0 fl code f5" placeholder=HTML wrap=soft autocomplete=on autocorrect=off autocapitalize=off spellcheck=on data-gramm=false></textarea>

  <iframe id="viewer" class="viewer bg-gold overflow-auto pre w-100 h-100 bn"></iframe>
</div>

<div class="buttons">
  <button class="print-hide pointer absolute top-0 right-0 w2 h2 bg-dark-gray near-white b--black-50 ba br0 outline-0 pa2 dim" 
  onclick="prompt('','https://itty.bitty.site/#/data:text/html;charset=utf-8,'+viewer.srcdoc)">&#9729;</button>

  <a href="#viewer">
    <button class="print-hide pointer absolute top-2 right-0 w2 h2 bg-dark-gray near-white b--black-50 ba br0 outline-0 pa2 dim">&#8609;</button>
  </a>
</div>

<script>
// elements
var editorHTML = document.querySelector('.html');
var editorCSS = document.querySelector('.css');
var editorJS = document.querySelector('.js');
var viewer = document.querySelector('.viewer');

if(window.location.hash) {
    // hash found
    var hash = window.location.hash.substring(1); // puts hash in variable, and removes the # character
    console.log(hash);

    // populate editors if theres any data already stored
    editorHTML.value = localStorage.getItem('HTMLcontent' + hash);
    editorCSS.value = localStorage.getItem('CSScontent' + hash);
    editorJS.value = localStorage.getItem('JScontent' + hash);

    // save data for each editor
    function saveHTMLDataHash() { localStorage.setItem('HTMLcontent' + hash, editorHTML.value); }
    function saveCSSDataHash() { localStorage.setItem('CSScontent' + hash, editorCSS.value); }
    function saveJSDataHash() { localStorage.setItem('JScontent' + hash, editorJS.value); }

    // listen and fire
    window.addEventListener("input", updateViewerHash);
    editorHTML.addEventListener("keyup", saveHTMLDataHash);
    editorCSS.addEventListener("keyup", saveCSSDataHash);
    editorJS.addEventListener("keyup", saveJSDataHash);

    // update viewer
    function updateViewerHash() {
        HTMLView = editorHTML.value;
        CSSView = '<style>@import url(https://unpkg.com/tachyons/css/tachyons.min.css);' + editorCSS.value + '<\/style>';
        JSView = '<script>' + editorJS.value + '<\/script>';

        viewer.srcdoc = HTMLView + CSSView + JSView;
    }
    updateViewerHash();
} else {
    // No hash found

    // populate editors if theres any data already stored
    editorHTML.value = localStorage.getItem('HTMLcontent');
    editorCSS.value = localStorage.getItem('CSScontent');
    editorJS.value = localStorage.getItem('JScontent');

    // save data for each editor
    function saveHTMLData() { localStorage.setItem('HTMLcontent', editorHTML.value); }
    function saveCSSData() { localStorage.setItem('CSScontent', editorCSS.value); }
    function saveJSData() { localStorage.setItem('JScontent', editorJS.value); }

    // listen and fire
    window.addEventListener("input", updateViewer);
    editorHTML.addEventListener("keyup", saveHTMLData);
    editorCSS.addEventListener("keyup", saveCSSData);
    editorJS.addEventListener("keyup", saveJSData);

    // update viewer
    function updateViewer() {
        HTMLView = editorHTML.value;
        CSSView = '<style>@import url(https://unpkg.com/tachyons/css/tachyons.min.css);' + editorCSS.value + '<\/style>';
        JSView = '<script>' + editorJS.value + '<\/script>';

        viewer.srcdoc = HTMLView + CSSView + JSView;
    }
    updateViewer();
}
</script>
</body>
</html>
