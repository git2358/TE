<style type="text/css">
@import url("https://unpkg.com/tachyons/css/tachyons.min.css");

:root {
  --nav-horizontal-width: 100vw;
  --nav-horizontal-height: 2em;

  --nav-vertical-width: 2em;
  --nav-vertical-height: 100vh;

  --one-third-width: calc(100vw/3);
  --two-thirds-width: calc(var(--one-third-width)*2);
  --half-width: calc((var(--one-third-width)*3)/2);
  --full-width: calc(var(--one-third-width)*3);
  --full-width-bleed: calc(var(--one-third-width)*4);

  --one-third-height: calc(100vh/3);
  --two-thirds-height: calc(var(--one-third-height)*2);
  --half-height: calc((var(--one-third-height)*3)/2);
  --full-height: calc(var(--one-third-height)*3);
  --full-height-bleed: calc(var(--one-third-width)*4);
}

::-webkit-scrollbar { width: 0; display: none; }
html {
  -ms-overflow-style: none;
  overflow-y: scroll;
  -webkit-overflow-scrolling: touch;
}

.grid { display: grid; }
.grid--top {
  grid-template-columns: var(--one-third-width) var(--one-third-width) var(--one-third-width);
  grid-template-rows: var(--nav-horizontal-height) var(--two-thirds-height) var(--full-height);
  grid-template-areas: "nav nav nav" "html css js" "viewer viewer viewer";
}
.grid--right {
  grid-template-columns: calc((var(--two-thirds-width)) - (var(--nav-vertical-width))) var(--one-third-width) var(--nav-vertical-width);
  grid-template-rows: var(--one-third-height) var(--one-third-height) var(--one-third-height);
  grid-template-areas: "viewer html nav" "viewer css nav" "viewer js nav";
}
.grid--bottom {
  display: grid;
  grid-template-columns: var(--one-third-width) var(--one-third-width) var(--one-third-width);
  grid-template-rows: var(--full-height) var(--two-thirds-height) var(--nav-horizontal-height);
  grid-template-areas: "viewer viewer viewer" "html css js" "nav nav nav" ;
}
.grid--left {
  grid-template-columns: var(--nav-vertical-width) var(--one-third-width) calc((var(--two-thirds-width)) - (var(--nav-vertical-width)));
  grid-template-rows: var(--one-third-height) var(--one-third-height) var(--one-third-height);
  grid-template-areas: "nav html viewer" "nav css viewer" "nav js viewer";
}

.nav{ grid-area: nav; }
.html { grid-area: html; }
.css { grid-area: css; }
.js { grid-area: js; }
.viewer { grid-area: viewer; }

.editor:focus { z-index: 999; }
textarea {
  resize: none;
  -webkit-border-radius: 0;
  border-radius: 0;
  -webkit-box-shadow: none;
  box-shadow: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  -ms-appearance: none;
  appearance: none;
}

textarea::placeholder {
  color: #fff;
  mix-blend-mode: difference;
}
	
@media print{
  .print-hide { display: none }
}
</style>

<body class="w-100 h-100 ma0">

<div class="grid">
  <div class="nav buttons bg-hot-pink code f7">
    <button class="print-hide pointer w2 h2 bg-dark-gray near-white bn outline-0 pa2 fl ma0 dim" 
    onclick="openCloud()">C</button>

    <button class="print-hide pointer w2 h2 bg-dark-gray near-white bn outline-0 pa2 fl ma0 dim" 
    onclick="downloadAll()">E</button>

    <button class="print-hide pointer w2 h2 bg-dark-gray near-white bn outline-0 pa2 fl ma0 dim" 
    onclick="downloadZip()">S</button>

    <button class="print-hide pointer w2 h2 bg-dark-gray near-white bn outline-0 pa2 fl ma0 dim" 
    onclick="document.getElementById('viewer').scrollIntoView(true);">V</button>

    <div class="layouts">
      <button class="print-hide pointer w2 h2 bg-dark-gray near-white bn outline-0 pa2 fl ma0 dim" 
      onclick="setLayout('top')">T</button>
      <button class="print-hide pointer w2 h2 bg-dark-gray near-white bn outline-0 pa2 fl ma0 dim" 
      onclick="setLayout('right')">R</button>
      <button class="print-hide pointer w2 h2 bg-dark-gray near-white bn outline-0 pa2 fl ma0 dim" 
      onclick="setLayout('bottom')">B</button>
      <button class="print-hide pointer w2 h2 bg-dark-gray near-white bn outline-0 pa2 fl ma0 dim" 
      onclick="setLayout('left')">L</button>
    </div>
  </div>

  <textarea class="html editor print-hide bg-red near-white pa4 input-reset bn outline-0 fl code f5" placeholder=HTML wrap=soft autocomplete=on autocorrect=off autocapitalize=off spellcheck=on data-gramm=false></textarea>

  <textarea class="css editor print-hide bg-green near-white pa4 input-reset bn outline-0 fl code f5" placeholder=CSS wrap=soft autocomplete=on autocorrect=off autocapitalize=off spellcheck=on data-gramm=false></textarea>

  <textarea class="js editor print-hide bg-blue near-white pa4 input-reset bn outline-0 fl code f5" placeholder=JS wrap=soft autocomplete=on autocorrect=off autocapitalize=off spellcheck=on data-gramm=false></textarea>

  <iframe id="viewer" class="viewer bg-gold overflow-auto pre w-100 h-100 bn"></iframe>
</div>

<script type="text/javascript">
// elements
var grid = document.querySelector(".grid");
var editorHTML = document.querySelector('.html');
var editorCSS = document.querySelector('.css');
var editorJS = document.querySelector('.js');
var viewer = document.querySelector('.viewer');

if(window.location.hash) {
    // hash found
    var hash = window.location.hash.substring(1); // puts hash in variable, and removes the # character

    // populate editors if theres any data already stored
    editorHTML.value = localStorage.getItem('HTMLcontent' + hash);
    editorCSS.value = localStorage.getItem('CSScontent' + hash);
    editorJS.value = localStorage.getItem('JScontent' + hash);

    // save data for each editor
    function saveHTMLDataHash() { localStorage.setItem('HTMLcontent' + hash, editorHTML.value); }
    function saveCSSDataHash() { localStorage.setItem('CSScontent' + hash, editorCSS.value); }
    function saveJSDataHash() { localStorage.setItem('JScontent' + hash, editorJS.value); }

    // listen and fire
    window.addEventListener("input", updateViewerHash);
    editorHTML.addEventListener("keyup", saveHTMLDataHash);
    editorCSS.addEventListener("keyup", saveCSSDataHash);
    editorJS.addEventListener("keyup", saveJSDataHash);

    // update viewer
    function updateViewerHash() {
        HTMLView = editorHTML.value;
        CSSView = '<style>@import url(https://unpkg.com/tachyons/css/tachyons.min.css);' + editorCSS.value + '<\/style>';
        JSView = '<script>' + editorJS.value + '<\/script>';

        viewer.srcdoc = HTMLView + CSSView + JSView;
    }
    updateViewerHash();
} else {
    // No hash found

    // populate editors if theres any data already stored
    editorHTML.value = localStorage.getItem('HTMLcontent');
    editorCSS.value = localStorage.getItem('CSScontent');
    editorJS.value = localStorage.getItem('JScontent');

    // save data for each editor
    function saveHTMLData() { localStorage.setItem('HTMLcontent', editorHTML.value); }
    function saveCSSData() { localStorage.setItem('CSScontent', editorCSS.value); }
    function saveJSData() { localStorage.setItem('JScontent', editorJS.value); }

    // listen and fire
    window.addEventListener("input", updateViewer);
    editorHTML.addEventListener("keyup", saveHTMLData);
    editorCSS.addEventListener("keyup", saveCSSData);
    editorJS.addEventListener("keyup", saveJSData);

    // update viewer
    function updateViewer() {
        HTMLView = editorHTML.value;
        CSSView = '<style>@import url(https://unpkg.com/tachyons/css/tachyons.min.css);' + editorCSS.value + '<\/style>';
        JSView = '<script>' + editorJS.value + '<\/script>';

        viewer.srcdoc = HTMLView + CSSView + JSView;
    }
    updateViewer();
}

function getLayout() {
    var gridLayout = localStorage.getItem('gridLayout');
    if (gridLayout) {
        setLayout(gridLayout);
    } else {
        localStorage.setItem('gridLayout', 'left');
        getLayout();
    }
}
function setLayout(pos) {
    var setLayout = "grid--" + pos;
    grid.classList.remove("grid--top", "grid--right", "grid--bottom", "grid--left");
    grid.classList.add(setLayout);
    localStorage.setItem('gridLayout', pos);
}
getLayout();

function openCloud() {
    window.open("http://git2358.github.io/urlpages/#" + btoa(encodeURIComponent(viewer.srcdoc)), "_blank");
}

Object.defineProperty(Date.prototype, 'YYYYMMDDHHMMSS', {
    value: function() {
        function pad2(n) {  // always returns a string
            return (n < 10 ? '0' : '') + n;
        }

        return this.getFullYear() +
               pad2(this.getMonth() + 1) + 
               pad2(this.getDate()) +
               pad2(this.getHours()) +
               pad2(this.getMinutes()) +
               pad2(this.getSeconds());
    }
});
function stampDate() {
    return stamp = new Date().YYYYMMDDHHMMSS();
}

function downloadAll() {
    downloadThis(editorHTML, "html");
    downloadThis(editorCSS, "css");
    downloadThis(editorJS, "js");
}

function downloadThis(elem, ext) {
    var text = elem.value;
    var ext = ext;

    // To retain the Line breaks.
    text = text.replace(/\n/g, "\r\n");

    var blob = new Blob([text], { type: "text/plain"});

    var anchor = document.createElement("a");
    anchor.download = hash + "-" + stampDate() + "." + ext;

    anchor.href = window.URL.createObjectURL(blob);
    anchor.target ="_blank";

    anchor.style.display = "none";

    document.body.appendChild(anchor);
    anchor.click();
    document.body.removeChild(anchor);
}

function downloadZip() {
  var zip = new JSZip();
  zip.file(hash + ".html", editorHTML.value);
  zip.file(hash + ".css", editorCSS.value);
  zip.file(hash + ".js", editorJS.value);

  zip.generateAsync({type:"blob"})
  .then(function(content) {
      saveAs(content, hash + ".zip");
  });
}
</script>
<script type="text/javascript" src="./jszip.min.js"></script>
<script type="text/javascript" src="./FileSaver.min.js"></script>
