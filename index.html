@import url("https://unpkg.com/tachyons/css/tachyons.min.css");

:root {
  --nav-horizontal-width: 100vw;
  --nav-horizontal-height: 2em;

  --nav-vertical-width: 2em;
  --nav-vertical-height: 100vh;

  --one-third-width: calc(100vw/3);
  --two-thirds-width: calc(var(--one-third-width)*2);
  --half-width: calc((var(--one-third-width)*3)/2);
  --half-third-width: calc(var(--one-third-width)/2);
  --full-width: calc(var(--one-third-width)*3);
  --full-width-bleed: calc(var(--one-third-width)*4);

  --one-third-height: calc(100vh/3);
  --two-thirds-height: calc(var(--one-third-height)*2);
  --half-height: calc((var(--one-third-height)*3)/2);
  --half-third-height: calc(var(--one-third-height)/2);
  --full-height: calc(var(--one-third-height)*3);
  --full-height-bleed: calc(var(--one-third-width)*4);
}

::-webkit-scrollbar {
  width: 0;
  display: none;
}

html {
  -ms-overflow-style: none;
  overflow-y: scroll;
  -webkit-overflow-scrolling: touch;
}

.grid {
  display: grid;
}

.grid--top {
  grid-template-columns: var(--one-third-width) var(--one-third-width) var(--one-third-width);
  grid-template-rows: var(--nav-horizontal-height) var(--two-thirds-height) var(--full-height);
  grid-template-areas:
    "nav nav nav"
    "html css js"
    "viewer viewer viewer";
}

.grid--top.focus--html {
  grid-template-columns: var(--two-thirds-width) var(--one-third-width);
  grid-template-rows: var(--nav-horizontal-height) var(--one-third-height) var(--one-third-height) var(--full-height);
  grid-template-areas:
    "nav nav"
    "html css"
    "html js"
    "viewer viewer";
}

.grid--top.focus--css {
  grid-template-columns: var(--two-thirds-width) var(--one-third-width);
  grid-template-rows: var(--nav-horizontal-height) var(--one-third-height) var(--one-third-height) var(--full-height);
  grid-template-areas:
    "nav nav"
    "css html"
    "css js"
    "viewer viewer";
}

.grid--top.focus--js {
  grid-template-columns: var(--two-thirds-width) var(--one-third-width);
  grid-template-rows: var(--nav-horizontal-height) var(--one-third-height) var(--one-third-height) var(--full-height);
  grid-template-areas:
    "nav nav"
    "js html"
    "js css"
    "viewer viewer";
}

.grid--right {
  grid-template-columns: calc((var(--two-thirds-width)) - (var(--nav-vertical-width))) var(--one-third-width) var(--nav-vertical-width);
  grid-template-rows: var(--one-third-height) var(--one-third-height) var(--one-third-height);
  grid-template-areas:
    "viewer html nav"
    "viewer css nav"
    "viewer js nav";
}

.grid--right.focus--html {
  grid-template-columns: calc((var(--two-thirds-width)) - (var(--nav-vertical-width))) var(--half-third-width) var(--half-third-width) var(--nav-vertical-width);
  grid-template-rows: var(--one-third-height) var(--one-third-height) var(--one-third-height);
  grid-template-areas:
    "viewer html html nav"
    "viewer html html nav"
    "viewer css js nav";
}

.grid--right.focus--css {
  grid-template-columns: calc((var(--two-thirds-width)) - (var(--nav-vertical-width))) var(--half-third-width) var(--half-third-width) var(--nav-vertical-width);

.grid--right.focus--js {

    "viewer html css nav";
}

.grid--bottom {

  grid-template-rows: var(--full-height) var(--two-thirds-height) var(--nav-horizontal-height);

}

.grid--bottom.focus--html {
  grid-template-columns: var(--two-thirds-width) var(--one-third-width);

.grid--bottom.focus--css {
  grid-template-columns: var(--two-thirds-width) var(--one-third-width);

  grid-template-areas:
    "viewer viewer"
    "css html"
    "css js"
    "nav nav";
}

.grid--bottom.focus--js {
  grid-template-columns: var(--two-thirds-width) var(--one-third-width);
  grid-template-rows: var(--full-height) var(--one-third-height) var(--one-third-height) var(--nav-horizontal-height);
  grid-template-areas:
    "viewer viewer"
    "js html"
    "js css"

}

.grid--left {
  grid-template-columns: var(--nav-vertical-width) var(--one-third-width) calc((var(--two-thirds-width)) - (var(--nav-vertical-width)));
  grid-template-rows: var(--one-third-height) var(--one-third-height) var(--one-third-height);

}

.grid--left.focus--html {

  grid-template-rows: var(--one-third-height) var(--one-third-height) var(--one-third-height);
  grid-template-areas:

}

.grid--left.focus--css {

  grid-template-rows: var(--one-third-height) var(--one-third-height) var(--one-third-height);

}

.grid--left.focus--js {

}

.grid--right .project-name,
.grid--left .project-name {
  width: 2rem;
  height: calc(var(--project-name-length, 1) * 2rem);
  writing-mode: vertical-rl;
  text-orientation: upright;
}

.project-name::placeholder {

}

@media screen and (max-width: 600px) {

  .grid[class*="grid--"] {
    display: flex;
    flex-direction: column;
  }

  .nav {
    position: sticky;
    top: 0;
    z-index: 1;
  }

  .layouts {
    display: none;
  }

  .mobile-nav {
    display: block;
  }

  .project-name {
    width: calc(var(--project-name-length, 1) * 2rem) !important;
    height: 2rem !important;
    writing-mode: horizontal-tb !important;
    text-orientation: mixed !important;
  }

  .nav button[onclick="setFocus('')"] {

  .html,

    min-width: 0;

  }

  .html,
  .css,
  .js {
    height: auto !important;
    min-height: calc(100vh - 32px);
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    touch-action: pan-y;

    overscroll-behavior: auto;
  }

  .viewer {
    position: relative;

  }

  .html,
  .css,
  .js,
  .viewer {
    position: sticky;

  }

  .html {

  }

  .css {

  }

  }

  .viewer {

  }

  .grid.viewer-only {

  .grid.viewer-only .viewer {

}

<body class="w-100 h-100 ma0">

<script type="text/javascript">

// elements
var grid = document.querySelector('.grid');
var editorHTML = document.querySelector('.html');
var editorCSS = document.querySelector('.css');
var editorJS = document.querySelector('.js');
var viewer = document.querySelector('.viewer');
var projectNameInput = document.querySelector('.project-name');

var defaultPageTitle = "[ 2358 | TE ]";

function updatePageTitle() {

  var name = projectNameInput.value.trim();

  document.title = name
    ? "[ " + name + " ]"
    : defaultPageTitle;

}

// hash
var rawHash = window.location.hash
  ? window.location.hash.substring(1)
  : "";
var hashParts = rawHash.split("?");
var hash = hashParts[0];
var projectName = hash && hash !== "P"
  ? decodeURIComponent(hash)
  : "";
var urlMarker = (hashParts[1] || "").toUpperCase();
var urlHide = urlMarker === "H";
var urlLayout = /^(T|R|B|L)$/.test(urlMarker)
    ? urlMarker.toLowerCase()
    : "";
var hashPayload = urlHide || urlLayout
  ? hashParts.slice(2).join("?")
  : hashParts.slice(1).join("?");

projectNameInput.value = projectName;

function updateProjectNameSize() {

  var length = Math.max(projectNameInput.value.length, 1);
  projectNameInput.style.setProperty("--project-name-length", length);

}

function updateProjectNameURL() {

  var name = projectNameInput.value.trim();

  if (!name) {

    projectName = "";
    hash = "P";

    history.replaceState(
      null,
      "",
      "#P" +
      ((urlLayout || urlHide) ? "?" + getUrlMarker() : "") +
      "?" + encodeEditorData()
    );

    updateProjectNameSize();
    updatePageTitle();

    return;

  }

  projectName = name;
  hash = encodeURIComponent(name);

  history.replaceState(
    null,
    "",
    "#" + hash +
    ((urlLayout || urlHide) ? "?" + getUrlMarker() : "") +
    "?" + encodeEditorData()
  );

  updateProjectNameSize();

}

projectNameInput.addEventListener("input", function() {
  updateProjectNameSize();
  updateProjectNameURL();
  updatePageTitle();
});

updateProjectNameSize();
updatePageTitle();

// URL payload
function loadEditorDataFromHash() {

  if (!hashPayload) {
    return false;
  }

  try {

    var base64 = hashPayload
      .replace(/-/g, "+")
      .replace(/_/g, "/");

    while (base64.length % 4) {
      base64 += "=";
    }

    var binary = atob(base64);
    var decoded;

    try {

      decoded = decodeURIComponent(binary);

    } catch (error) {

      decoded = decodeURIComponent(
        binary
          .split("")
          .map(function(character) {
            return "%" + ("00" + character.charCodeAt(0).toString(16)).slice(-2);
          })
          .join("")
      );

    }

    var data = JSON.parse(decoded);

    if (
      !data ||
      typeof data.html !== "string" ||
      typeof data.css !== "string" ||
      typeof data.js !== "string"
    ) {
      return false;
    }

    editorHTML.value = data.html;
    editorCSS.value = data.css;
    editorJS.value = data.js;

    return true;

  } catch (error) {

    return false;

  }

}

var editorDataFromHash = loadEditorDataFromHash();

function encodeEditorData() {

  return btoa(
    encodeURIComponent(JSON.stringify({
      html: editorHTML.value,
      css: editorCSS.value,
      js: editorJS.value
    }))
  );

}

function getLayoutMarker() {

  return normalizeLayout(urlLayout).charAt(0).toUpperCase();

}

function getUrlMarker() {

  return urlHide
    ? getLayoutMarker() + "H"
    : urlLayout
      ? getLayoutMarker()
      : "H";

}

function updateHashFromEditors() {

  if (hash) {
    history.replaceState(null, "", "#" + hash +
      ((urlLayout || urlHide) ? "?" + getUrlMarker() : "") +
      "?" + encodeEditorData());
  }

}

function resizeMobileEditor(editor) {

  if (window.innerWidth <= 600) {
    editor.style.setProperty("height", "auto", "important");
    editor.style.setProperty(
      "height",
      Math.max(editor.scrollHeight, window.innerHeight) + "px",
      "important"
    );
  } else {
    editor.style.removeProperty("height");
  }

}

function resizeMobileEditors() {

  resizeMobileEditor(editorHTML);
  resizeMobileEditor(editorCSS);
  resizeMobileEditor(editorJS);

}

// ----------------------------------------
// Load saved editor content
// ----------------------------------------

if (editorDataFromHash) {

  function saveHTMLDataHashPayload() {
    localStorage.setItem('HTMLcontent' + hash, editorHTML.value);
  }

  function saveCSSDataHashPayload() {
    localStorage.setItem('CSScontent' + hash, editorCSS.value);
  }

  function saveJSDataHashPayload() {
    localStorage.setItem('JScontent' + hash, editorJS.value);
  }

  function updateViewerHashPayload() {

    var HTMLView = editorHTML.value;

    var CSSView =
      '<style>\n' +
      '@import url("https://unpkg.com/tachyons/css/tachyons.min.css");\n' +
      editorCSS.value +
      '\n<\/style>';

    var JSView =
      '<script>\n' +
      editorJS.value +
      '\n<\/script>';

    viewer.srcdoc = HTMLView + CSSView + JSView;

    updateHashFromEditors();
    viewerIsEmpty();
  }

  window.addEventListener("input", updateViewerHashPayload);
  window.addEventListener("input", resizeMobileEditors);
  window.addEventListener("resize", resizeMobileEditors);

  editorHTML.addEventListener("keyup", saveHTMLDataHashPayload);
  editorCSS.addEventListener("keyup", saveCSSDataHashPayload);
  editorJS.addEventListener("keyup", saveJSDataHashPayload);

  updateViewerHashPayload();
  resizeMobileEditors();

} else if (window.location.hash) {

  // populate editors from hash
  editorHTML.value = localStorage.getItem('HTMLcontent' + hash) || '';
  editorCSS.value = localStorage.getItem('CSScontent' + hash) || '';
  editorJS.value = localStorage.getItem('JScontent' + hash) || '';

  // save data for each editor
  function saveHTMLDataHash() {
    localStorage.setItem('HTMLcontent' + hash, editorHTML.value);
  }

  function saveCSSDataHash() {
    localStorage.setItem('CSScontent' + hash, editorCSS.value);
  }

  function saveJSDataHash() {
    localStorage.setItem('JScontent' + hash, editorJS.value);
  }

  // update viewer
  function updateViewerHash() {

    var HTMLView = editorHTML.value;

    var CSSView =
      '<style>\n' +
      '@import url("https://unpkg.com/tachyons/css/tachyons.min.css");\n' +
      editorCSS.value +
      '\n<\/style>';

    var JSView =
      '<script>\n' +
      editorJS.value +
      '\n<\/script>';

    viewer.srcdoc = HTMLView + CSSView + JSView;

    updateHashFromEditors();
    viewerIsEmpty();
  }

  // listen and fire
  window.addEventListener("input", updateViewerHash);
  window.addEventListener("input", resizeMobileEditors);
  window.addEventListener("resize", resizeMobileEditors);

  editorHTML.addEventListener("keyup", saveHTMLDataHash);
  editorCSS.addEventListener("keyup", saveCSSDataHash);
  editorJS.addEventListener("keyup", saveJSDataHash);

  updateViewerHash();
  resizeMobileEditors();

} else {

  // populate editors from local storage
  editorHTML.value = localStorage.getItem('HTMLcontent') || '';
  editorCSS.value = localStorage.getItem('CSScontent') || '';
  editorJS.value = localStorage.getItem('JScontent') || '';

  // save data for each editor
  function saveHTMLData() {
    localStorage.setItem('HTMLcontent', editorHTML.value);
  }

  function saveCSSData() {
    localStorage.setItem('CSScontent', editorCSS.value);
  }

  function saveJSData() {
    localStorage.setItem('JScontent', editorJS.value);
  }

  // update viewer
  function updateViewer() {

    var HTMLView = editorHTML.value;

    var CSSView =
      '<style>\n' +
      '@import url("https://unpkg.com/tachyons/css/tachyons.min.css");\n' +
      editorCSS.value +
      '\n<\/style>';

    var JSView =
      '<script>\n' +
      editorJS.value +
      '\n<\/script>';

    viewer.srcdoc = HTMLView + CSSView + JSView;

    updateHashFromEditors();
    viewerIsEmpty();
  }

  // listen and fire
  window.addEventListener("input", updateViewer);
  window.addEventListener("input", resizeMobileEditors);
  window.addEventListener("resize", resizeMobileEditors);

  editorHTML.addEventListener("keyup", saveHTMLData);
  editorCSS.addEventListener("keyup", saveCSSData);
  editorJS.addEventListener("keyup", saveJSData);

  updateViewer();
  resizeMobileEditors();
}


// ----------------------------------------
// Editor undo and redo
// ----------------------------------------

function enableEditorHistory(editor) {

  var history = {
    undo: [],
    redo: [],
    value: editor.value,
    restoring: false
  };

  editor.addEventListener("input", function() {

    if (!history.restoring && editor.value !== history.value) {
      history.undo.push(history.value);
      history.redo = [];
      history.value = editor.value;
    }

  });

  editor.addEventListener("keydown", function(event) {

    var modifier = event.metaKey || event.ctrlKey;
    var undo = modifier && !event.shiftKey && event.key.toLowerCase() === "z";
    var redo = modifier && event.shiftKey && event.key.toLowerCase() === "z";

    if (!undo && !redo) {
      return;
    }

    event.preventDefault();

    var source = undo ? history.undo : history.redo;
    var target = undo ? history.redo : history.undo;

    if (!source.length) {
      return;
    }

    target.push(editor.value);
    editor.value = source.pop();
    history.value = editor.value;
    history.restoring = true;
    editor.dispatchEvent(new Event("input", { bubbles: true }));
    history.restoring = false;
    editor.dispatchEvent(new Event("keyup", { bubbles: true }));

  });

}

enableEditorHistory(editorHTML);
enableEditorHistory(editorCSS);
enableEditorHistory(editorJS);


// ----------------------------------------
// Class utilities
// ----------------------------------------

function removeClassesByPrefix(el, prefix) {

  for (var i = el.classList.length - 1; i >= 0; i--) {

    if (el.classList[i].startsWith(prefix)) {
      el.classList.remove(el.classList[i]);
    }

  }

}


// ----------------------------------------
// Layout
// ----------------------------------------

function getLayout() {

  var gridLayout = localStorage.getItem('gridLayout');

  if (gridLayout) {

    setLayout(gridLayout);

  } else {

    localStorage.setItem('gridLayout', 'left');
    getLayout();

  }

}

function normalizeLayout(pos) {

  var shortLayouts = {
    t: "top",
    r: "right",
    b: "bottom",
    l: "left"
  };

  return shortLayouts[pos.toLowerCase()] || pos;

}

function setLayout(pos, updateUrl) {

  pos = normalizeLayout(pos);

  var layoutClass = "grid--" + pos;

  removeClassesByPrefix(grid, "grid--");

  grid.classList.add(layoutClass);

  localStorage.setItem('gridLayout', pos);

  if (updateUrl && hash) {
    urlLayout = pos;
    history.replaceState(null, "", "#" + hash +
      "?" + getUrlMarker() +
      "?" + encodeEditorData());
  }

}

function setViewerOnly(hidden) {

  grid.classList.toggle("viewer-only", hidden);

}


// ----------------------------------------
// Focus
// ----------------------------------------

function getFocus() {

  var editorFocus = localStorage.getItem('editorFocus');

  if (editorFocus) {

    setFocus(editorFocus);

  } else {

    localStorage.setItem('editorFocus', '');
    getLayout();

  }

}

function setFocus(pos) {

  var focusClass = "focus--" + pos;

  removeClassesByPrefix(grid, "focus--");

  if (pos) {
    grid.classList.add(focusClass);
  }

  localStorage.setItem('editorFocus', pos);

}


// ----------------------------------------
// Initialize layout
// ----------------------------------------

getLayout();
getFocus();
setViewerOnly(urlHide);

if (urlLayout || urlHide) {

  if (urlLayout) {
    setLayout(urlLayout);
  }

  window.addEventListener("load", function() {

    setTimeout(function() {
      scrollToViewer();
    }, 500);

  });

}


function shareHash() {

  updateHashFromEditors();

  var url = window.location.href;

  function copyFallback() {

    var input = document.createElement("textarea");
    input.value = url;
    document.body.appendChild(input);
    input.select();
    document.execCommand("copy");
    document.body.removeChild(input);

  }

  if (navigator.clipboard && navigator.clipboard.writeText) {

    navigator.clipboard.writeText(url).catch(copyFallback);

  } else {

    copyFallback();

  }

}


// ----------------------------------------
// Date stamp
// ----------------------------------------

Object.defineProperty(Date.prototype, 'YYYYMMDDHHMMSS', {

  value: function() {

    function pad2(n) {
      return (n < 10 ? '0' : '') + n;
    }

    return this.getFullYear() +
      pad2(this.getMonth() + 1) +
      pad2(this.getDate()) +
      pad2(this.getHours()) +
      pad2(this.getMinutes()) +
      pad2(this.getSeconds());

  }

});

function stampDate() {

  return new Date().YYYYMMDDHHMMSS();

}


// ----------------------------------------
// ZIP creation
// ----------------------------------------

function crc32(data) {

  var table = [];

  for (var n = 0; n < 256; n++) {

    var c = n;

    for (var k = 0; k < 8; k++) {
      c = (c & 1)
        ? 0xedb88320 ^ (c >>> 1)
        : c >>> 1;
    }

    table[n] = c >>> 0;

  }

  var crc = 0xffffffff;

  for (var i = 0; i < data.length; i++) {
    crc = table[(crc ^ data[i]) & 0xff] ^ (crc >>> 8);
  }

  return (crc ^ 0xffffffff) >>> 0;

}


function writeUint16(view, offset, value) {

  view.setUint16(offset, value, true);

}


function writeUint32(view, offset, value) {

  view.setUint32(offset, value >>> 0, true);

}


function createZip(files) {

  var encoder = new TextEncoder();

  var localHeaders = [];
  var centralHeaders = [];

  var offset = 0;

  var now = new Date();

  var year = Math.max(now.getFullYear(), 1980);
  var month = now.getMonth() + 1;
  var day = now.getDate();

  var hours = now.getHours();
  var minutes = now.getMinutes();
  var seconds = Math.floor(now.getSeconds() / 2);

  var dosTime =
    (hours << 11) |
    (minutes << 5) |
    seconds;

  var dosDate =
    ((year - 1980) << 9) |
    (month << 5) |
    day;


  files.forEach(function(file) {

    var name = encoder.encode(file.name);
    var data = encoder.encode(file.content);

    var crc = crc32(data);

    // ----------------------------------------
    // Local file header
    // ----------------------------------------

    var localHeader = new ArrayBuffer(30 + name.length);
    var localView = new DataView(localHeader);

    writeUint32(localView, 0, 0x04034b50);
    writeUint16(localView, 4, 20);
    writeUint16(localView, 6, 0x0800);
    writeUint16(localView, 8, 0);
    writeUint16(localView, 10, dosTime);
    writeUint16(localView, 12, dosDate);
    writeUint32(localView, 14, crc);
    writeUint32(localView, 18, data.length);
    writeUint32(localView, 22, data.length);
    writeUint16(localView, 26, name.length);
    writeUint16(localView, 28, 0);

    new Uint8Array(localHeader, 30).set(name);

    localHeaders.push({
      header: new Uint8Array(localHeader),
      data: data
    });

    // ----------------------------------------
    // Central directory header
    // ----------------------------------------

    var centralHeader = new ArrayBuffer(46 + name.length);
    var centralView = new DataView(centralHeader);

    writeUint32(centralView, 0, 0x02014b50);
    writeUint16(centralView, 4, 20);
    writeUint16(centralView, 6, 20);
    writeUint16(centralView, 8, 0x0800);
    writeUint16(centralView, 10, 0);
    writeUint16(centralView, 12, dosTime);
    writeUint16(centralView, 14, dosDate);
    writeUint32(centralView, 16, crc);
    writeUint32(centralView, 20, data.length);
    writeUint32(centralView, 24, data.length);
    writeUint16(centralView, 28, name.length);
    writeUint16(centralView, 30, 0);
    writeUint16(centralView, 32, 0);
    writeUint16(centralView, 34, 0);
    writeUint16(centralView, 36, 0);
    writeUint32(centralView, 38, 0);
    writeUint32(centralView, 42, offset);

    new Uint8Array(centralHeader, 46).set(name);

    centralHeaders.push(new Uint8Array(centralHeader));

    offset += localHeader.byteLength + data.length;

  });


  // ----------------------------------------
  // Calculate central directory size
  // ----------------------------------------

  var centralDirectorySize = centralHeaders.reduce(
    function(total, header) {
      return total + header.length;
    },
    0
  );


  // ----------------------------------------
  // End of central directory
  // ----------------------------------------

  var endHeader = new ArrayBuffer(22);
  var endView = new DataView(endHeader);

  writeUint32(endView, 0, 0x06054b50);
  writeUint16(endView, 4, 0);
  writeUint16(endView, 6, 0);
  writeUint16(endView, 8, files.length);
  writeUint16(endView, 10, files.length);
  writeUint32(endView, 12, centralDirectorySize);
  writeUint32(endView, 16, offset);
  writeUint16(endView, 20, 0);


  // ----------------------------------------
  // Combine everything
  // ----------------------------------------

  var parts = [];

  localHeaders.forEach(function(file) {
    parts.push(file.header);
    parts.push(file.data);
  });

  centralHeaders.forEach(function(header) {
    parts.push(header);
  });

  parts.push(new Uint8Array(endHeader));


  return new Blob(parts, {
    type: "application/zip"
  });

}


// ----------------------------------------
// Download ZIP
// ----------------------------------------

function downloadZip() {

  var zipName = projectName.trim() || "P";

  var zip = createZip([
    {
      name: zipName + ".html",
      content: [
        "<!doctype html>",
        "<html lang=\"en\">",
        "<head>",
        "<meta charset=\"UTF-8\">",
        "<title>" + zipName + "</title>",
        "<link rel=\"stylesheet\" href=\"./" + zipName + ".css\">",
        "</head>",
        "<body>",
        editorHTML.value,
        "<script src=\"./" + zipName + ".js\"><\/script>",
        "</body>",
        "</html>"
      ].join("\n")
    },

    {
      name: zipName + ".css",
      content: [
        "@import url(\"https://unpkg.com/tachyons/css/tachyons.min.css\");",
        editorCSS.value
      ].join("\n")
    },

    {
      name: zipName + ".js",
      content: editorJS.value
    }
  ]);

  var url = URL.createObjectURL(zip);
  var link = document.createElement("a");

  link.href = url;
  link.download = zipName + "-" + stampDate() + ".zip";

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  setTimeout(function() {
    URL.revokeObjectURL(url);
  }, 1000);

}


// ----------------------------------------
// Viewer empty state
// ----------------------------------------

function viewerIsEmpty() {

  if (
    editorHTML.value !== "" ||
    editorCSS.value !== "" ||
    editorJS.value !== ""
  ) {

    viewer.classList.remove("bg-gold");

  } else {

    viewer.classList.add("bg-gold");

  }

}


// ----------------------------------------
// Smooth scroll to viewer
// ----------------------------------------

function scrollToViewer() {

  if (
    editorHTML.value === "" &&
    editorCSS.value === "" &&
    editorJS.value === ""
  ) {
    return;
  }

  scrollToSection(document.getElementById("viewer"));

}

function smoothScrollTo(top) {

  window.scrollTo({
    top: top,
    behavior: "smooth"
  });

}

function scrollToSection(section) {

  var navOffset = window.innerWidth <= 600 && section !== viewer
    ? document.querySelector(".nav").offsetHeight
    : 0;
  var top = 0;

  if (window.innerWidth <= 600) {

    Array.from(grid.children).some(function(child) {

      if (child === section) {
        return true;
      }

      top += child.offsetHeight;
      return false;

    });

  } else {

    top = section.offsetTop;

  }

  smoothScrollTo(top - navOffset);

}

function scrollToEditor(type) {

  scrollToSection(document.querySelector("." + type));

}


// ----------------------------------------
// Scroll to viewer once on page load
// ----------------------------------------

window.addEventListener("load", function() {

  setTimeout(function() {

    scrollToViewer();

  }, 500);

});

</script>
