@import url("./css/tachyons.min.css");

:root {
  --nav-horizontal-width: 100vw;
  --nav-horizontal-height: 2em;

  --nav-vertical-width: 2em;
  --nav-vertical-height: 100vh;

  --one-third-width: calc(100vw/3);
  --two-thirds-width: calc(var(--one-third-width)*2);
  --half-width: calc((var(--one-third-width)*3)/2);
  --half-third-width: calc(var(--one-third-width)/2);
  --full-width: calc(var(--one-third-width)*3);
  --full-width-bleed: calc(var(--one-third-width)*4);

  --one-third-height: calc(100vh/3);
  --two-thirds-height: calc(var(--one-third-height)*2);
  --half-height: calc((var(--one-third-height)*3)/2);
  --half-third-height: calc(var(--one-third-height)/2);
  --full-height: calc(var(--one-third-height)*3);
  --full-height-bleed: calc(var(--one-third-width)*4);
}

::-webkit-scrollbar {
  width: 0;
  display: none;
}

html {
  -ms-overflow-style: none;
  overflow-y: scroll;
  -webkit-overflow-scrolling: touch;
}

html.viewer-only-page,
body.viewer-only-page {
  min-height: 100%;
}

body.viewer-only-page {
  overflow-x: hidden;
}


/* ----------------------------------------
   Grid layouts
   ---------------------------------------- */

.grid {
  display: grid;
}

.grid--top {
  grid-template-columns:
    var(--one-third-width)
    var(--one-third-width)
    var(--one-third-width);

  grid-template-rows:
    var(--nav-horizontal-height)
    var(--two-thirds-height)
    var(--full-height);

  grid-template-areas:
    "nav nav nav"
    "html css js"
    "viewer viewer viewer";
}

.grid--top.focus--html {
  grid-template-columns:
    var(--two-thirds-width)
    var(--one-third-width);

  grid-template-rows:
    var(--nav-horizontal-height)
    var(--one-third-height)
    var(--one-third-height)
    var(--full-height);

  grid-template-areas:
    "nav nav"
    "html css"
    "html js"
    "viewer viewer";
}

.grid--top.focus--css {
  grid-template-columns:
    var(--two-thirds-width)
    var(--one-third-width);

  grid-template-rows:
    var(--nav-horizontal-height)
    var(--one-third-height)
    var(--one-third-height)
    var(--full-height);

  grid-template-areas:
    "nav nav"
    "css html"
    "css js"
    "viewer viewer";
}

.grid--top.focus--js {
  grid-template-columns:
    var(--two-thirds-width)
    var(--one-third-width);

  grid-template-rows:
    var(--nav-horizontal-height)
    var(--one-third-height)
    var(--one-third-height)
    var(--full-height);

  grid-template-areas:
    "nav nav"
    "js html"
    "js css"
    "viewer viewer";
}


.grid--right {
  grid-template-columns:
    calc((var(--two-thirds-width)) - (var(--nav-vertical-width)))
    var(--one-third-width)
    var(--nav-vertical-width);

  grid-template-rows:
    var(--one-third-height)
    var(--one-third-height)
    var(--one-third-height);

  grid-template-areas:
    "viewer html nav"
    "viewer css nav"
    "viewer js nav";
}

.grid--right.focus--html {
  grid-template-columns:
    calc((var(--two-thirds-width)) - (var(--nav-vertical-width)))
    var(--half-third-width)
    var(--half-third-width)
    var(--nav-vertical-width);

  grid-template-rows:
    var(--one-third-height)
    var(--one-third-height)
    var(--one-third-height);

  grid-template-areas:
    "viewer html html nav"
    "viewer html html nav"
    "viewer css js nav";
}

.grid--right.focus--css {
  grid-template-columns:
    calc((var(--two-thirds-width)) - (var(--nav-vertical-width)))
    var(--half-third-width)
    var(--half-third-width)
    var(--nav-vertical-width);

  grid-template-rows:
    var(--one-third-height)
    var(--one-third-height)
    var(--one-third-height);

  grid-template-areas:
    "viewer css css nav"
    "viewer css css nav"
    "viewer html js nav";
}

.grid--right.focus--js {
  grid-template-columns:
    calc((var(--two-thirds-width)) - (var(--nav-vertical-width)))
    var(--half-third-width)
    var(--half-third-width)
    var(--nav-vertical-width);

  grid-template-rows:
    var(--one-third-height)
    var(--one-third-height)
    var(--one-third-height);

  grid-template-areas:
    "viewer js js nav"
    "viewer js js nav"
    "viewer html css nav";
}


.grid--bottom {

    var(--one-third-width)
    var(--one-third-width)
    var(--one-third-width);

  grid-template-rows:
    var(--full-height)
    var(--two-thirds-height)
    var(--nav-horizontal-height);

  grid-template-areas:
    "viewer viewer viewer"
    "html css js"
    "nav nav nav";
}

.grid--bottom.focus--html {
  grid-template-columns:
    var(--two-thirds-width)
    var(--one-third-width);

  grid-template-rows:
    var(--full-height)
    var(--one-third-height)
    var(--one-third-height)
    var(--nav-horizontal-height);

  grid-template-areas:
    "viewer viewer"
    "html css"
    "html js"

}

.grid--bottom.focus--css {
  grid-template-columns:

  grid-template-rows:

    var(--one-third-height)

.grid--bottom.focus--js {

    var(--one-third-height)
    var(--one-third-height)
    var(--nav-horizontal-height);

  grid-template-areas:
    "viewer viewer viewer"
    "js html css"
    "nav nav nav";
}


.grid--left {
  grid-template-columns:
    var(--nav-vertical-width)
    var(--one-third-width)
    calc((var(--two-thirds-width)) - (var(--nav-vertical-width)));

  grid-template-rows:
    var(--one-third-height)
    var(--one-third-height)
    var(--one-third-height);

  grid-template-areas:
    "nav html viewer"
    "nav css viewer"
    "nav js viewer";
}

.grid--left.focus--html {
  grid-template-columns:

  grid-template-rows:
    var(--one-third-height)
    var(--one-third-height)
    var(--one-third-height);

  grid-template-areas:
    "nav html html viewer"
    "nav html html viewer"

.grid--left.focus--css {

/* ----------------------------------------
   Navigation
   ---------------------------------------- */

.nav {
  grid-area: nav;

  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  align-items: flex-start;

  overflow: hidden;

  min-width: 0;
  min-height: 0;

  white-space: nowrap;
}

.nav .layouts {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;

  flex: 0 0 auto;
}

.nav > button {
  flex: 0 0 2rem;
}


/* ----------------------------------------
   Project name
   ---------------------------------------- */

.project-name-wrap {
  box-sizing: border-box;

  flex: 1 1 auto;

  min-width: 0;
  min-height: 2rem;

  width: auto;
  height: 2rem;

  overflow: hidden;

  position: relative;

  background: #333;
}

.project-name {
  box-sizing: border-box;

  display: block;

  position: absolute;
  inset: 0;

  width: 100%;
  height: 2rem;

  min-width: 0;
  min-height: 2rem;

  max-width: 100%;
  max-height: 100%;

  background: #333;
  color: #fff;

  border: 0;
  border-radius: 0;
  outline: 0;

  padding: 0.5em;

  text-align: left;
  text-transform: uppercase;
  letter-spacing: 1em;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: clip;

  caret-color: #fff;

  -ms-overflow-style: none;
  scrollbar-width: none;

  float: none !important;

  z-index: 2;
}

.project-name.project-name--has-text {
  padding-left: 1.5em;
}

.project-name::-webkit-scrollbar {
  width: 0;
  height: 0;
  display: none;
}


/* ----------------------------------------
   Vertical desktop navigation
   ---------------------------------------- */

.grid--right .nav,
.grid--left .nav {
  flex-direction: column;
  flex-wrap: nowrap;
}

.grid--right .nav .layouts,
.grid--left .nav .layouts {
  flex-direction: column;
}

.grid--right .project-name-wrap,
.grid--left .project-name-wrap {
  width: 2rem;
  height: auto;

  flex: 1 1 auto;

  min-width: 2rem;
  min-height: 0;

  max-width: 2rem;
  max-height: none;

  overflow: hidden;
}

.grid--right .project-name,
.grid--left .project-name {
  width: 2rem;
  height: 100%;

  min-width: 2rem;
  min-height: 0;

  max-width: 2rem;
  max-height: 100%;

  writing-mode: vertical-rl;
  text-orientation: upright;

  text-align: center;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: clip;
}


/*
 * Vertical project names:
 *
 * - Keep the project name horizontally aligned
 *   with the P button.
 * - Remove the inherited horizontal padding
 *   that shifts the text sideways.
 * - Add a full line of vertical separation
 *   before the project name begins.
 */
.grid--right .project-name.project-name--has-text,
.grid--left .project-name.project-name--has-text {
  padding-top: 1.5em;
  padding-left: 0 !important;
  padding-right: 0 !important;
}


/* ----------------------------------------
   Other grid elements
   ---------------------------------------- */

.html {
  grid-area: html;
}

.css {
  grid-area: css;
}

.js {
  grid-area: js;
}

.viewer {
  grid-area: viewer;
}


/* ----------------------------------------
   Viewer only / H mode
   ---------------------------------------- */

.grid.viewer-only {
  display: block;
  width: 100vw;
  min-height: 0;
  height: auto;
}

.grid.viewer-only .nav,
.grid.viewer-only .editor {
  display: none;
}

.grid.viewer-only .viewer {
  display: block;
  width: 100vw;
  height: 100vh;
  min-height: 0;
  overflow: hidden;
}


/* ----------------------------------------
   Mobile navigation
   ---------------------------------------- */

.mobile-nav {
  display: none;
}


/* ----------------------------------------
   Mobile
   ---------------------------------------- */

@media screen and (max-width: 600px) {

  .grid[class*="grid--"] {
    display: flex;
    flex-direction: column;
  }


  .nav,
  .grid--top .nav,
  .grid--right .nav,
  .grid--bottom .nav,
  .grid--left .nav {
    position: sticky;
    top: 0;
    z-index: 1;

    display: flex !important;

    flex-direction: row !important;
    flex-wrap: nowrap !important;

    align-items: flex-start;

    width: 100%;
    height: 2rem;

    min-width: 0;
    min-height: 2rem;

    overflow: hidden;
  }


  /*
   * H / viewer-only mode must override
   * the mobile navigation display rule above.
   */
  .grid.viewer-only .nav {
    display: none !important;
  }


  .layouts {
    display: none !important;
  }


  .mobile-nav {
    display: block;
  }


  .project-name-wrap,
  .grid--right .project-name-wrap,
  .grid--left .project-name-wrap {
    box-sizing: border-box;

    width: auto !important;
    height: 2rem !important;

    min-width: 0 !important;
    min-height: 2rem !important;

    max-width: none !important;
    max-height: 2rem !important;

    flex: 1 1 auto !important;

    overflow: hidden !important;
  }


  .project-name,
  .grid--right .project-name,
  .grid--left .project-name {
    box-sizing: border-box;

    writing-mode: horizontal-tb !important;
    text-orientation: mixed !important;

    width: 100% !important;
    height: 2rem !important;

    min-width: 0 !important;
    min-height: 2rem !important;

    max-width: 100% !important;
    max-height: 2rem !important;

    text-align: left !important;

    white-space: nowrap;

    overflow: hidden !important;

    text-overflow: clip !important;
  }


  /*
   * Mobile/horizontal project names retain
   * the normal left-hand separation from P.
   */
  .project-name.project-name--has-text,
  .grid--right .project-name.project-name--has-text,
  .grid--left .project-name.project-name--has-text {
    padding-left: 1.5em !important;
    padding-top: 0.5em !important;
  }


  .nav button[onclick="setFocus('')"] {
    display: none;
  }


  .html,
  .css,
  .js,
  .viewer {
    min-width: 0;
    min-height: 100vh;
    width: 100%;
  }


  .html,
  .css,
  .js {
    height: auto !important;

    min-height: calc(100vh - 32px);
    max-height: calc(100vh - 32px);

    overflow-y: auto;

    touch-action: pan-y;

    -webkit-overflow-scrolling: touch;

    overscroll-behavior: auto;
  }


  .viewer {
    position: relative;
    z-index: 2;
  }


  .html,
  .css,
  .js,
  .viewer {
    position: sticky;

    top: 32px;

    align-self: start;

    flex: 0 0 auto;
  }


  .html {
    z-index: 1;
  }

  .css {
    z-index: 2;
  }

  .js {
    z-index: 3;
  }

  .viewer {
    z-index: 4;

    top: 0;

    min-height: calc(100vh + 32px);
  }


  /*
   * In H mode the viewer must behave as
   * the only page element on mobile.
   */
  .grid.viewer-only {
    display: block;

    width: 100vw;

    height: auto;

    min-height: 0;
  }


  .grid.viewer-only .viewer {
    display: block;

    position: static;

    width: 100vw;

    min-height: 100vh;
    height: 100vh;
  }

}

<script type="text/javascript">

// elements
var grid =
  document.querySelector('.grid');

var editorHTML =
  document.querySelector('.html');

var editorCSS =
  document.querySelector('.css');

var editorJS =
  document.querySelector('.js');

var viewer =
  document.querySelector('.viewer');

var projectNameInput =
  document.querySelector('.project-name');

var projectNameWrap =
  document.querySelector('.project-name-wrap');

var defaultPageTitle =
  "[ 2358 | TE ]";


// ----------------------------------------
// Project name display
// ----------------------------------------

function updateProjectNameDisplay() {

  if (!projectNameInput) {
    return;
  }

  var hasText =
    projectNameInput.value.trim() !== "";

  projectNameInput.classList.toggle(
    "project-name--has-text",
    hasText
  );

}


// ----------------------------------------
// Project name URL
// ----------------------------------------

function updateProjectNameURL() {

  var name =
    projectNameInput.value.trim();

  if (!name) {

    projectName =
      "";

    hash =
      "P";

    history.replaceState(
      null,
      "",
      "#P" +
      (
        (urlLayout || urlHide)
          ? "?" + getUrlMarker()
          : ""
      ) +
      "?" +
      encodeEditorData()
    );

    updatePageTitle();
    updateProjectNameDisplay();

    return;
  }

  projectName =
    name;

  hash =
    encodeURIComponent(name);

  history.replaceState(
    null,
    "",
    "#" +
    hash +
    (
      (urlLayout || urlHide)
        ? "?" + getUrlMarker()
        : ""
    ) +
    "?" +
    encodeEditorData()
  );

  updateProjectNameDisplay();

}


function updatePageTitle() {

  var name =
    projectNameInput.value.trim();

  document.title =
    name
      ? "[ " + name + " ]"
      : defaultPageTitle;

}


projectNameInput.addEventListener(
  "input",
  function() {

    updateProjectNameURL();
    updatePageTitle();
    updateProjectNameDisplay();

  }
);


projectNameInput.addEventListener(
  "focus",
  function() {

    updateProjectNameDisplay();

  }
);


window.addEventListener(
  "resize",
  function() {

    updateProjectNameDisplay();

  }
);


// ----------------------------------------
// Hash
// ----------------------------------------

var rawHash =
  window.location.hash
    ? window.location.hash.substring(1)
    : "";

var hashParts =
  rawHash.split("?");

var hash =
  hashParts[0] || "P";

var projectName =
  hash !== "P"
    ? decodeURIComponent(hash)
    : "";

var urlMarker =
  (hashParts[1] || "").toUpperCase();

var urlHide =
  urlMarker === "H";

var urlLayout =
  /^(T|R|B|L)$/.test(urlMarker)
    ? urlMarker.toLowerCase()
    : "left";

var hashPayload =
  urlHide ||
  /^(T|R|B|L)$/.test(urlMarker)
    ? hashParts.slice(2).join("?")
    : hashParts.slice(1).join("?");


projectNameInput.value =
  projectName;

updatePageTitle();


// ----------------------------------------
// URL payload
// ----------------------------------------

function loadEditorDataFromHash() {

  if (!hashPayload) {
    return false;
  }

  try {

    var base64 =
      hashPayload
        .replace(/-/g, "+")
        .replace(/_/g, "/");

    while (base64.length % 4) {
      base64 += "=";
    }

    var binary =
      atob(base64);

    var decoded;

    try {

      decoded =
        decodeURIComponent(binary);

    } catch (error) {

      decoded =
        decodeURIComponent(
          binary
            .split("")
            .map(
              function(character) {

                return "%" +
                  (
                    "00" +
                    character
                      .charCodeAt(0)
                      .toString(16)
                  ).slice(-2);

              }
            )
            .join("")
        );

    }

    var data =
      JSON.parse(decoded);

    if (
      !data ||
      typeof data.html !== "string" ||
      typeof data.css !== "string" ||
      typeof data.js !== "string"
    ) {

      return false;

    }

    editorHTML.value =
      data.html;

    editorCSS.value =
      data.css;

    editorJS.value =
      data.js;

    return true;

  } catch (error) {

    return false;

  }

}


var editorDataFromHash =
  loadEditorDataFromHash();


function encodeEditorData() {

  return btoa(
    encodeURIComponent(
      JSON.stringify({
        html: editorHTML.value,
        css: editorCSS.value,
        js: editorJS.value
      })
    )
  );

}


function getLayoutMarker() {

  return normalizeLayout(
    urlLayout
  ).charAt(0).toUpperCase();

}


function getUrlMarker() {

  return urlHide
    ? "H"
    : getLayoutMarker();

}


function updateHashFromEditors() {

  if (hash) {

    history.replaceState(
      null,
      "",
      "#" +
      hash +
      (
        (urlLayout || urlHide)
          ? "?" + getUrlMarker()
          : ""
      ) +
      "?" +
      encodeEditorData()
    );

  }

}


function resizeMobileEditor(editor) {

  if (window.innerWidth <= 600) {

    editor.style.setProperty(
      "height",
      "auto",
      "important"
    );

    editor.style.setProperty(
      "height",
      Math.max(
        editor.scrollHeight,
        window.innerHeight
      ) + "px",
      "important"
    );

  } else {

    editor.style.removeProperty(
      "height"
    );

  }

}


function resizeMobileEditors() {

  resizeMobileEditor(editorHTML);
  resizeMobileEditor(editorCSS);
  resizeMobileEditor(editorJS);

}


// ----------------------------------------
// Viewer document helpers
// ----------------------------------------

function buildViewerBridge() {

  var viewerOnly =
    urlHide ? "true" : "false";

  return [
    "<script>",
    "(function(){",
    "var viewerOnly=" + viewerOnly + ";",
    "var originalScrollIntoView=Element.prototype.scrollIntoView;",
    "Element.prototype.scrollIntoView=function(){",
    "var element=this;",
    "var args=arguments;",
    "var options=typeof args[0]==='boolean'?",
    "{block:args[0]?'start':'end'}:",
    "(args[0]||{});",
    "if(!viewerOnly){",
    "return originalScrollIntoView.apply(element,args);",
    "}",
    "originalScrollIntoView.apply(element,args);",
    "function sendScroll(){",
    "try{",
    "var rect=element.getBoundingClientRect();",
    "var root=document.documentElement;",
    "var body=document.body;",
    "var scrollTop=",
    "(root&&root.scrollTop)||",
    "(body&&body.scrollTop)||0;",
    "parent.postMessage({",
    "type:'TE_SCROLL',",
    "top:scrollTop+rect.top,",
    "height:rect.height,",
    "behavior:options.behavior||'auto',",
    "block:options.block||'start'",
    "},'*');",
    "}catch(error){}",
    "}",
    "requestAnimationFrame(function(){",
    "requestAnimationFrame(sendScroll);",
    "});",
    "};",
    "function getHeight(){",
    "var root=document.documentElement;",
    "var body=document.body;",
    "return Math.max(",
    "root?root.scrollHeight:0,",
    "root?root.offsetHeight:0,",
    "root?root.clientHeight:0,",
    "body?body.scrollHeight:0,",
    "body?body.offsetHeight:0,",
    "body?body.clientHeight:0",
    ");",
    "}",
    "function sendResize(){",
    "try{",
    "parent.postMessage({",
    "type:'TE_RESIZE',",
    "height:getHeight()",
    "},'*');",
    "}catch(error){}",
    "}",
    "if(window.ResizeObserver){",
    "var resizeObserver=new ResizeObserver(function(){",
    "sendResize();",
    "});",
    "if(document.documentElement){",
    "resizeObserver.observe(document.documentElement);",
    "}",
    "if(document.body){",
    "resizeObserver.observe(document.body);",
    "}",
    "}",
    "if(window.MutationObserver){",
    "var mutationObserver=new MutationObserver(function(){",
    "sendResize();",
    "});",
    "if(document.documentElement){",
    "mutationObserver.observe(document.documentElement,{",
    "subtree:true,",
    "childList:true,",
    "attributes:true",
    "});",
    "}",
    "}",
    "window.addEventListener('load',sendResize);",
    "window.addEventListener('resize',sendResize);",
    "requestAnimationFrame(sendResize);",
    "})();",
    "<\/script>"
  ].join("");

}


function buildViewerSrcdoc(
  HTMLView,
  CSSView,
  JSView
) {

  return buildViewerBridge() +
    HTMLView +
    CSSView +
    JSView;

}


// ----------------------------------------
// Viewer background helpers
// ----------------------------------------

function editorsHaveContent() {

  return (
    editorHTML.value !== "" ||
    editorCSS.value !== "" ||
    editorJS.value !== ""
  );

}


function setDefaultViewerBackground() {

  if (editorsHaveContent()) {

    viewer.classList.remove(
      "bg-gold"
    );

    viewer.style.setProperty(
      "background-color",
      "rgb(255, 255, 255)",
      "important"
    );

  } else {

    viewer.classList.add(
      "bg-gold"
    );

    viewer.style.removeProperty(
      "background-color"
    );

  }

}


function isTransparentBackgroundColor(color) {

  if (!color) {
    return true;
  }

  if (color === "transparent") {
    return true;
  }

  var match =
    color.match(
      /^rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*([\d.]+)\s*)?\)$/
    );

  if (
    match &&
    match[1] !== undefined
  ) {

    return parseFloat(
      match[1]
    ) === 0;

  }

  return false;

}


function getBackgroundSource(style) {

  if (!style) {
    return null;
  }

  var image =
    style.backgroundImage;

  if (
    image &&
    image !== "none"
  ) {

    return {
      image: image,
      color: style.backgroundColor,
      repeat: style.backgroundRepeat,
      position: style.backgroundPosition,
      size: style.backgroundSize,
      attachment: style.backgroundAttachment,
      origin: style.backgroundOrigin,
      clip: style.backgroundClip
    };

  }

  if (
    !isTransparentBackgroundColor(
      style.backgroundColor
    )
  ) {

    return {
      image: "none",
      color: style.backgroundColor,
      repeat: style.backgroundRepeat,
      position: style.backgroundPosition,
      size: style.backgroundSize,
      attachment: style.backgroundAttachment,
      origin: style.backgroundOrigin,
      clip: style.backgroundClip
    };

  }

  return null;

}


function syncViewerBackground() {

  if (!urlHide) {
    return;
  }

  try {

    var frameDocument =
      viewer.contentDocument;

    if (!frameDocument) {
      return;
    }

    var frameHTML =
      frameDocument.documentElement;

    var frameBody =
      frameDocument.body;

    if (!frameHTML) {
      return;
    }

    var htmlStyle =
      window.getComputedStyle(
        frameHTML
      );

    var bodyStyle =
      frameBody
        ? window.getComputedStyle(
            frameBody
          )
        : null;

    /*
     * Check BODY first because this is the usual
     * location for a project background.
     */
    var background =
      getBackgroundSource(
        bodyStyle
      );

    /*
     * Then check HTML.
     */
    if (!background) {

      background =
        getBackgroundSource(
          htmlStyle
        );

    }

    var pageHTML =
      document.documentElement;

    var pageBody =
      document.body;

    /*
     * No explicit HTML/BODY background:
     *
     * empty editors  -> yellow
     * content exists -> white
     */
    if (!background) {

      if (editorsHaveContent()) {

        pageHTML.style.backgroundImage =
          "none";

        pageHTML.style.backgroundColor =
          "rgb(255, 255, 255)";

        pageBody.style.backgroundImage =
          "none";

        pageBody.style.backgroundColor =
          "rgb(255, 255, 255)";

        viewer.classList.remove(
          "bg-gold"
        );

      } else {

        pageHTML.style.backgroundImage =
          "none";

        pageHTML.style.backgroundColor =
          "rgb(255, 215, 0)";

        pageBody.style.backgroundImage =
          "none";

        pageBody.style.backgroundColor =
          "rgb(255, 215, 0)";

        viewer.classList.add(
          "bg-gold"
        );

      }

      return;

    }

    /*
     * An explicit HTML/BODY background exists.
     * Copy it to the H-mode page.
     */
    var color =
      background.color;

    if (
      !color ||
      color === "transparent" ||
      isTransparentBackgroundColor(
        color
      )
    ) {

      color =
        "rgb(255, 255, 255)";

    }

    pageHTML.style.backgroundImage =
      "none";

    pageHTML.style.backgroundColor =
      color;

    pageBody.style.backgroundImage =
      background.image;

    pageBody.style.backgroundColor =
      color;

    pageBody.style.backgroundRepeat =
      background.repeat;

    pageBody.style.backgroundPosition =
      background.position;

    pageBody.style.backgroundSize =
      background.size;

    pageBody.style.backgroundAttachment =
      background.attachment;

    pageBody.style.backgroundOrigin =
      background.origin;

    pageBody.style.backgroundClip =
      background.clip;

    viewer.classList.remove(
      "bg-gold"
    );

  } catch (error) {

  }

}


// ----------------------------------------
// H mode iframe sizing
// ----------------------------------------

function resizeViewerToContent() {

  if (!urlHide) {
    return;
  }

  try {

    var frameDocument =
      viewer.contentDocument;

    if (!frameDocument) {
      return;
    }

    var frameHTML =
      frameDocument.documentElement;

    var frameBody =
      frameDocument.body;

    if (!frameHTML) {
      return;
    }

    var height =
      Math.max(
        frameHTML.scrollHeight || 0,
        frameHTML.offsetHeight || 0,
        frameHTML.clientHeight || 0,
        frameBody
          ? frameBody.scrollHeight || 0
          : 0,
        frameBody
          ? frameBody.offsetHeight || 0
          : 0,
        frameBody
          ? frameBody.clientHeight || 0
          : 0,
        window.innerHeight
      );

    viewer.style.setProperty(
      "height",
      height + "px",
      "important"
    );

    viewer.style.setProperty(
      "min-height",
      window.innerHeight + "px",
      "important"
    );

  } catch (error) {

    viewer.style.setProperty(
      "height",
      "100vh",
      "important"
    );

  }

}


var viewerResizeObserver = null;
var viewerResizeFrame = 0;


function scheduleViewerOnlyPageUpdate() {

  if (viewerResizeFrame) {
    return;
  }

  viewerResizeFrame =
    requestAnimationFrame(
      function() {

        viewerResizeFrame =
          0;

        updateViewerOnlyPage();

      }
    );

}


function observeViewerContent() {

  if (viewerResizeObserver) {

    viewerResizeObserver.disconnect();

    viewerResizeObserver =
      null;

  }

  if (!urlHide) {
    return;
  }

  try {

    var frameDocument =
      viewer.contentDocument;

    if (
      !frameDocument ||
      !window.ResizeObserver
    ) {
      return;
    }

    var frameHTML =
      frameDocument.documentElement;

    var frameBody =
      frameDocument.body;

    viewerResizeObserver =
      new ResizeObserver(
        function() {

          scheduleViewerOnlyPageUpdate();

        }
      );

    if (frameHTML) {

      viewerResizeObserver.observe(
        frameHTML
      );

    }

    if (frameBody) {

      viewerResizeObserver.observe(
        frameBody
      );

    }

  } catch (error) {

  }

}


function updateViewerOnlyPage() {

  if (!urlHide) {
    return;
  }

  syncViewerBackground();
  resizeViewerToContent();

}


// ----------------------------------------
// H mode scroll bridge
// ----------------------------------------

function scrollViewerToElement(data) {

  if (
    !urlHide ||
    !data
  ) {
    return;
  }

  try {

    var frameRect =
      viewer.getBoundingClientRect();

    var elementTop =
      window.scrollY +
      frameRect.top +
      (Number(data.top) || 0);

    var elementHeight =
      Number(data.height) || 0;

    var block =
      data.block || "start";

    var target =
      elementTop;

    if (block === "center") {

      target =
        elementTop -
        (
          window.innerHeight -
          elementHeight
        ) / 2;

    } else if (block === "end") {

      target =
        elementTop -
        window.innerHeight +
        elementHeight;

    } else if (block === "nearest") {

      var viewportTop =
        window.scrollY;

      var viewportBottom =
        viewportTop +
        window.innerHeight;

      var elementBottom =
        elementTop +
        elementHeight;

      if (
        elementTop >= viewportTop &&
        elementBottom <= viewportBottom
      ) {

        target =
          viewportTop;

      } else if (
        elementTop < viewportTop
      ) {

        target =
          elementTop;

      } else {

        target =
          elementBottom -
          window.innerHeight;

      }

    }

    target =
      Math.max(
        0,
        target
      );

    window.scrollTo({
      top: target,
      behavior: data.behavior || "auto"
    });

  } catch (error) {

  }

}


window.addEventListener(
  "message",
  function(event) {

    if (
      event.source !==
      viewer.contentWindow
    ) {
      return;
    }

    var data =
      event.data || {};

    if (
      data.type ===
      "TE_RESIZE"
    ) {

      scheduleViewerOnlyPageUpdate();

      return;

    }

    if (
      data.type ===
      "TE_SCROLL"
    ) {

      scrollViewerToElement(
        data
      );

    }

  }
);


// ----------------------------------------
// Viewer load
// ----------------------------------------

viewer.addEventListener(
  "load",
  function() {

    if (!urlHide) {
      return;
    }

    observeViewerContent();
    updateViewerOnlyPage();

    requestAnimationFrame(
      function() {

        updateViewerOnlyPage();

      }
    );

  }
);


window.addEventListener(
  "resize",
  function() {

    if (urlHide) {
      updateViewerOnlyPage();
    }

  }
);

// ----------------------------------------
// Normalize URL
// ----------------------------------------

function normalizeInitialURL() {

  var marker =
    urlHide
      ? "H"
      : (
          urlLayout || "left"
        ).charAt(0).toUpperCase();

  history.replaceState(
    null,
    "",
    "#" +
    hash +
    "?" +
    marker +
    "?" +
    encodeEditorData()
  );

}

normalizeInitialURL();


// ----------------------------------------
// Editor undo and redo
// ----------------------------------------

function enableEditorHistory(editor) {

  var history = {
    undo: [],
    redo: [],
    value: editor.value,
    restoring: false
  };


  editor.addEventListener(
    "input",
    function() {

      if (
        !history.restoring &&
        editor.value !== history.value
      ) {

        history.undo.push(
          history.value
        );

        history.redo = [];

        history.value =
          editor.value;

      }

    }
  );


  editor.addEventListener(
    "keydown",
    function(event) {

      var modifier =
        event.metaKey ||
        event.ctrlKey;

      var undo =
        modifier &&
        !event.shiftKey &&
        event.key.toLowerCase() === "z";

      var redo =
        modifier &&
        event.shiftKey &&
        event.key.toLowerCase() === "z";

      if (!undo && !redo) {
        return;
      }

      event.preventDefault();

      var source =
        undo
          ? history.undo
          : history.redo;

      var target =
        undo
          ? history.redo
          : history.undo;

      if (!source.length) {
        return;
      }

      target.push(
        editor.value
      );

      editor.value =
        source.pop();

      history.value =
        editor.value;

      history.restoring = true;

      editor.dispatchEvent(
        new Event(
          "input",
          { bubbles: true }
        )
      );

      history.restoring = false;

      editor.dispatchEvent(
        new Event(
          "keyup",
          { bubbles: true }
        )
      );

    }
  );

}


enableEditorHistory(editorHTML);
enableEditorHistory(editorCSS);
enableEditorHistory(editorJS);


// ----------------------------------------
// Class utilities
// ----------------------------------------

function removeClassesByPrefix(
  el,
  prefix
) {

  for (
    var i = el.classList.length - 1;
    i >= 0;
    i--
  ) {

    if (
      el.classList[i].startsWith(
        prefix
      )
    ) {

      el.classList.remove(
        el.classList[i]
      );

    }

  }

}


// ----------------------------------------
// Layout
// ----------------------------------------

function getLayout() {

  var gridLayout =
    localStorage.getItem(
      'gridLayout'
    );

  if (gridLayout) {

    setLayout(
      gridLayout
    );

  } else {

    localStorage.setItem(
      'gridLayout',
      'left'
    );

    getLayout();

  }

}


function normalizeLayout(pos) {

  var shortLayouts = {
    t: "top",
    r: "right",
    b: "bottom",
    l: "left"
  };

  return shortLayouts[
    pos.toLowerCase()
  ] || pos;

}


function setLayout(
  pos,
  updateUrl
) {

  pos =
    normalizeLayout(pos);

  var layoutClass =
    "grid--" + pos;

  removeClassesByPrefix(
    grid,
    "grid--"
  );

  grid.classList.add(
    layoutClass
  );

  localStorage.setItem(
    'gridLayout',
    pos
  );


  if (
    updateUrl &&
    hash &&
    !urlHide
  ) {

    urlLayout =
      pos;

    history.replaceState(
      null,
      "",
      "#" +
      hash +
      "?" +
      getLayoutMarker() +
      "?" +
      encodeEditorData()
    );

  }

  updateProjectNameDisplay();

}


function setViewerOnly(hidden) {

  grid.classList.toggle(
    "viewer-only",
    hidden
  );

  document.documentElement.classList.toggle(
    "viewer-only-page",
    hidden
  );

  document.body.classList.toggle(
    "viewer-only-page",
    hidden
  );


  if (hidden) {

    viewer.classList.remove(
      "bg-gold"
    );

    viewer.style.setProperty(
      "height",
      "100vh",
      "important"
    );

    viewer.style.setProperty(
      "min-height",
      "100vh",
      "important"
    );

    setTimeout(
      function() {

        observeViewerContent();
        updateViewerOnlyPage();

      },
      0
    );

  } else {

    if (viewerResizeObserver) {

      viewerResizeObserver.disconnect();

      viewerResizeObserver =
        null;

    }

    viewer.style.removeProperty(
      "height"
    );

    viewer.style.removeProperty(
      "min-height"
    );

    document.documentElement.style.removeProperty(
      "background-image"
    );

    document.documentElement.style.removeProperty(
      "background-color"
    );

    document.body.style.removeProperty(
      "background-image"
    );

    document.body.style.removeProperty(
      "background-color"
    );

    document.body.style.removeProperty(
      "background-repeat"
    );

    document.body.style.removeProperty(
      "background-position"
    );

    document.body.style.removeProperty(
      "background-size"
    );

    document.body.style.removeProperty(
      "background-attachment"
    );

    document.body.style.removeProperty(
      "background-origin"
    );

    document.body.style.removeProperty(
      "background-clip"
    );

    viewerIsEmpty();

  }

}


// ----------------------------------------
// Focus
// ----------------------------------------

function getFocus() {

  var editorFocus =
    localStorage.getItem(
      'editorFocus'
    );

  if (editorFocus) {

    setFocus(
      editorFocus
    );

  } else {

    localStorage.setItem(
      'editorFocus',
      ''
    );

    getLayout();

  }

}


function setFocus(pos) {

  var focusClass =
    "focus--" + pos;

  removeClassesByPrefix(
    grid,
    "focus--"
  );

  if (pos) {

    grid.classList.add(
      focusClass
    );

  }

  localStorage.setItem(
    'editorFocus',
    pos
  );

}


// ----------------------------------------
// Initialize layout
// ----------------------------------------

getLayout();
getFocus();
setViewerOnly(urlHide);


if (
  urlLayout ||
  urlHide
) {

  if (urlLayout) {

    setLayout(
      urlLayout
    );

  }

  window.addEventListener(
    "load",
    function() {

      setTimeout(
        function() {

          scrollToViewer();

        },
        500
      );

    }
  );

}


// ----------------------------------------
// Share
// ----------------------------------------

function shareHash() {

  updateHashFromEditors();

  var url =
    window.location.href;


  function copyFallback() {

    var input =
      document.createElement(
        "textarea"
      );

    input.value =
      url;

    document.body.appendChild(
      input
    );

    input.select();

    document.execCommand(
      "copy"
    );

    document.body.removeChild(
      input
    );

  }


  if (
    navigator.clipboard &&
    navigator.clipboard.writeText
  ) {

    navigator.clipboard
      .writeText(url)
      .catch(
        copyFallback
      );

  } else {

    copyFallback();

  }

}


// ----------------------------------------
// Date stamp
// ----------------------------------------

Object.defineProperty(
  Date.prototype,
  'YYYYMMDDHHMMSS',
  {

    value: function() {

      function pad2(n) {

        return (
          n < 10
            ? '0'
            : ''
        ) + n;

      }

      return this.getFullYear() +
        pad2(this.getMonth() + 1) +
        pad2(this.getDate()) +
        pad2(this.getHours()) +
        pad2(this.getMinutes()) +
        pad2(this.getSeconds());

    }

  }
);


function stampDate() {

  return new Date().YYYYMMDDHHMMSS();

}


// ----------------------------------------
// ZIP creation
// ----------------------------------------

function crc32(data) {

  var table = [];

  for (
    var n = 0;
    n < 256;
    n++
  ) {

    var c = n;

    for (
      var k = 0;
      k < 8;
      k++
    ) {

      c =
        (c & 1)
          ? 0xedb88320 ^
            (c >>> 1)
          : c >>> 1;

    }

    table[n] =
      c >>> 0;

  }

  var crc =
    0xffffffff;

  for (
    var i = 0;
    i < data.length;
    i++
  ) {

    crc =
      table[
        (crc ^ data[i]) & 0xff
      ] ^
      (crc >>> 8);

  }

  return (
    crc ^
    0xffffffff
  ) >>> 0;

}


function writeUint16(
  view,
  offset,
  value
) {

  view.setUint16(
    offset,
    value,
    true
  );

}


function writeUint32(
  view,
  offset,
  value
) {

  view.setUint32(
    offset,
    value >>> 0,
    true
  );

}


function createZip(files) {

  var encoder =
    new TextEncoder();

  var localHeaders = [];
  var centralHeaders = [];

  var offset = 0;

  var now =
    new Date();

  var year =
    Math.max(
      now.getFullYear(),
      1980
    );

  var month =
    now.getMonth() + 1;

  var day =
    now.getDate();

  var hours =
    now.getHours();

  var minutes =
    now.getMinutes();

  var seconds =
    Math.floor(
      now.getSeconds() / 2
    );

  var dosTime =
    (hours << 11) |
    (minutes << 5) |
    seconds;

  var dosDate =
    ((year - 1980) << 9) |
    (month << 5) |
    day;


  files.forEach(
    function(file) {

      var name =
        encoder.encode(
          file.name
        );

      var data =
        encoder.encode(
          file.content
        );

      var crc =
        crc32(data);


      var localHeader =
        new ArrayBuffer(
          30 + name.length
        );

      var localView =
        new DataView(
          localHeader
        );

      writeUint32(
        localView,
        0,
        0x04034b50
      );

      writeUint16(
        localView,
        4,
        20
      );

      writeUint16(
        localView,
        6,
        0x0800
      );

      writeUint16(
        localView,
        8,
        0
      );

      writeUint16(
        localView,
        10,
        dosTime
      );

      writeUint16(
        localView,
        12,
        dosDate
      );

      writeUint32(
        localView,
        14,
        crc
      );

      writeUint32(
        localView,
        18,
        data.length
      );

      writeUint32(
        localView,
        22,
        data.length
      );

      writeUint16(
        localView,
        26,
        name.length
      );

      writeUint16(
        localView,
        28,
        0
      );

      new Uint8Array(
        localHeader,
        30
      ).set(name);

      localHeaders.push({
        header:
          new Uint8Array(
            localHeader
          ),
        data:
          data
      });


      var centralHeader =
        new ArrayBuffer(
          46 + name.length
        );

      var centralView =
        new DataView(
          centralHeader
        );

      writeUint32(
        centralView,
        0,
        0x02014b50
      );

      writeUint16(
        centralView,
        4,
        20
      );

      writeUint16(
        centralView,
        6,
        20
      );

      writeUint16(
        centralView,
        8,
        0x0800
      );

      writeUint16(
        centralView,
        10,
        0
      );

      writeUint16(
        centralView,
        12,
        dosTime
      );

      writeUint16(
        centralView,
        14,
        dosDate
      );

      writeUint32(
        centralView,
        16,
        crc
      );

      writeUint32(
        centralView,
        20,
        data.length
      );

      writeUint32(
        centralView,
        24,
        data.length
      );

      writeUint16(
        centralView,
        28,
        name.length
      );

      writeUint16(
        centralView,
        30,
        0
      );

      writeUint16(
        centralView,
        32,
        0
      );

      writeUint16(
        centralView,
        34,
        0
      );

      writeUint16(
        centralView,
        36,
        0
      );

      writeUint32(
        centralView,
        38,
        0
      );

      writeUint32(
        centralView,
        42,
        offset
      );

      new Uint8Array(
        centralHeader,
        46
      ).set(name);

      centralHeaders.push(
        new Uint8Array(
          centralHeader
        )
      );

      offset +=
        localHeader.byteLength +
        data.length;

    }
  );


  var centralDirectorySize =
    centralHeaders.reduce(
      function(total, header) {

        return total +
          header.length;

      },
      0
    );


  var endHeader =
    new ArrayBuffer(22);

  var endView =
    new DataView(
      endHeader
    );

  writeUint32(
    endView,
    0,
    0x06054b50
  );

  writeUint16(
    endView,
    4,
    0
  );

  writeUint16(
    endView,
    6,
    0
  );

  writeUint16(
    endView,
    8,
    files.length
  );

  writeUint16(
    endView,
    10,
    files.length
  );

  writeUint32(
    endView,
    12,
    centralDirectorySize
  );

  writeUint32(
    endView,
    16,
    offset
  );

  writeUint16(
    endView,
    20,
    0
  );


  var parts = [];

  localHeaders.forEach(
    function(file) {

      parts.push(
        file.header
      );

      parts.push(
        file.data
      );

    }
  );

  centralHeaders.forEach(
    function(header) {

      parts.push(
        header
      );

    }
  );

  parts.push(
    new Uint8Array(
      endHeader
    )
  );


  return new Blob(
    parts,
    {
      type: "application/zip"
    }
  );

}


// ----------------------------------------
// Download ZIP
// ----------------------------------------

function downloadZip() {

  var zipName =
    projectName.trim() || "P";

  var zip =
    createZip([
      {
        name:
          zipName + ".html",

        content: [
          "<!doctype html>",
          "<html lang=\"en\">",
          "<head>",
          "<meta charset=\"UTF-8\">",
          "<title>" + zipName + "</title>",
          "<link rel=\"stylesheet\" href=\"./" +
            zipName +
            ".css\">",
          "</head>",
          "<body>",
          editorHTML.value,
          "<script src=\"./" +
            zipName +
            ".js\"><\/script>",
          "</body>",
          "</html>"
        ].join("\n")
      },

      {
        name:
          zipName + ".css",

        content: [
          "@import url(\"https://git2358.github.io/TE/css/tachyons.min.css\");",
          editorCSS.value
        ].join("\n")
      },

      {
        name:
          zipName + ".js",

        content:
          editorJS.value
      }
    ]);


  var url =
    URL.createObjectURL(zip);

  var link =
    document.createElement("a");

  link.href =
    url;

  link.download =
    zipName +
    "-" +
    stampDate() +
    ".zip";

  document.body.appendChild(
    link
  );

  link.click();

  document.body.removeChild(
    link
  );

  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}


// ----------------------------------------
// Viewer empty state
// ----------------------------------------

function viewerIsEmpty() {

  /*
   * Always start with the normal preview fallback.
   * Empty = yellow.
   * Content = white.
   *
   * An explicit html/body background inside the
   * iframe is rendered by the iframe itself and
   * therefore remains visible over this fallback.
   */
  setDefaultViewerBackground();

  if (urlHide) {

    /*
     * H mode has its own background synchronisation.
     * Do not let the iframe element's yellow fallback
     * interfere with the copied html/body background.
     */
    viewer.classList.remove(
      "bg-gold"
    );

    viewer.style.removeProperty(
      "background-color"
    );

    scheduleViewerOnlyPageUpdate();

    return;

  }

}


// ----------------------------------------
// Smooth scroll to viewer
// ----------------------------------------

function scrollToViewer() {

  scrollToSection(
    document.getElementById(
      "viewer"
    )
  );

}


function smoothScrollTo(top) {

  window.scrollTo({
    top: top,
    behavior: "smooth"
  });

}


function scrollToSection(section) {

  var navOffset =
    window.innerWidth <= 600 &&
    section !== viewer
      ? document.querySelector(
          ".nav"
        ).offsetHeight
      : 0;

  var top = 0;


  if (window.innerWidth <= 600) {

    Array.from(
      grid.children
    ).some(
      function(child) {

        if (child === section) {
          return true;
        }

        top +=
          child.offsetHeight;

        return false;

      }
    );

  } else {

    top =
      section.offsetTop;

  }


  smoothScrollTo(
    top - navOffset
  );

}


function scrollToEditor(type) {

  scrollToSection(
    document.querySelector(
      "." + type
    )
  );

}


// ----------------------------------------
// Scroll to viewer once on page load
// ----------------------------------------

window.addEventListener(
  "load",
  function() {

    updateProjectNameDisplay();

    setTimeout(
      function() {

        scrollToViewer();

        if (urlHide) {
          updateViewerOnlyPage();
        }

      },
      500
    );

  }
);


// ----------------------------------------
// Initial project-name display
// ----------------------------------------

updateProjectNameDisplay();

</script>
